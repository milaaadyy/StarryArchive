<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Мистический гороскоп</title>

<style>

* { box-sizing: border-box; margin: 0; padding: 0; }

body { font-family: sans-serif; background: #0d0820; color: #e9e4ff; padding: 20px; }

.app { max-width: 600px; margin: 0 auto; }

h1 { font-size: 24px; text-align: center; color: #f4e2a1; margin-bottom: 5px; }

.tagline { text-align: center; color: #9a8fc0; font-size: 13px; margin-bottom: 20px; }

.tabs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }

.tab { padding: 8px 14px; border-radius: 20px; border: 1px solid #4a3a7a; background: transparent; color: #c9bfe8; cursor: pointer; }

.tab.active { background: #6a4fc0; color: #fff; }

.panel { display: none; background: #1a1233; padding: 20px; border-radius: 15px; }

.panel.active { display: block; }

.sign-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }

.sign-btn { padding: 10px; border-radius: 10px; border: 1px solid #3d2f6b; background: transparent; color: #d9d0f5; cursor: pointer; text-align: center; font-size: 14px; }

.sign-btn.active { border-color: #c9a227; background: rgba(201,162,39,.15); }

.week-title { font-size: 18px; color: #f4e2a1; margin-bottom: 10px; }

.day { padding: 10px; border-left: 2px solid #6a4fc0; margin-bottom: 8px; background: #2a1a4a; }

.day b { color: #c9a227; }

.meta li { list-style: none; padding: 5px 0; font-size: 14px; }

select { width: 100%; padding: 10px; margin-bottom: 10px; background: #0d0820; color: #fff; border: 1px solid #4a3a7a; border-radius: 8px; }

.btn { padding: 12px; width: 100%; background: #6a4fc0; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 10px;}

.bar-track { height: 8px; background: #2a1a4a; border-radius: 4px; margin-bottom: 10px; overflow: hidden; }

.bar-fill { height: 100%; background: #c9a227; width: 0; transition: width 0.5s; }

.hidden { display: none; }

.qday-box { text-align: center; padding: 20px; background: #2a1a4a; border-radius: 10px; font-size: 18px; color: #f4e2a1; margin-bottom: 15px;}

.tarot-card { width: 120px; height: 180px; margin: 0 auto 15px; border: 2px solid #c9a227; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 40px; background: #1c1338;}

.tarot-card span { font-size: 14px; color: #fff; margin-top: 10px; }

.result-text { font-size: 14px; margin-top: 10px; color: #ddd; }

</style>

</head>

<body>

<div class="app">

<h1> Мистический гороскоп</h1>

<p class="tagline">Развлекательные интерпретации</p>

<div class="tabs">

<button class="tab active" onclick="showTab('week', this)">Неделя</button>

<button class="tab" onclick="showTab('compat', this)">Совместимость</button>

<button class="tab" onclick="showTab('dark', this)">Тёмная сторона</button>

<button class="tab" onclick="showTab('fate', this)">Судьба</button>

<button class="tab" onclick="showTab('tarot', this)">Карта дня</button>

<button class="tab" onclick="showTab('qday', this)">Вопрос дня</button>

</div>

<div id="week" class="panel active">

<div class="sign-grid" id="weekSigns"></div>

<div id="weekContent"></div>

</div>

<div id="compat" class="panel">

<select id="signA"></select>

<select id="signB"></select>

<button class="btn" onclick="calcCompat()">Проверить</button>

<div id="compatResult" class="hidden" style="margin-top:15px;">

<div>❤️ Любовь <div class="bar-track"><div class="bar-fill" id="bLove"></div></div></div>

<div> Страсть <div class="bar-track"><div class="bar-fill" id="bPassion"></div></div></div>

<div> Понимание <div class="bar-track"><div class="bar-fill" id="bMind"></div></div></div>

<div> Дружба <div class="bar-track"><div class="bar-fill" id="bFriend"></div></div></div>

<p class="result-text" id="compatText"></p>

</div>

</div>

<div id="dark" class="panel">

<div class="sign-grid" id="darkSigns"></div>

<div id="darkContent"></div>

</div>

<div id="fate" class="panel">

<div class="sign-grid" id="fateSigns"></div>

<div id="fateContent"></div>

</div>

<div id="tarot" class="panel" style="text-align:center;">

<div class="tarot-card" id="tCard"><span id="tIcon"></span><span id="tName"></span></div>

<p class="result-text" id="tMeaning"></p>

</div>

<div id="qday" class="panel">

<div class="qday-box" id="qText"></div>

<button class="btn" onclick="nextQday()">Ещё совет</button>

</div>

</div>

<script>

const SIGNS = [

{ id:"aries", name:"Овен", sym:"♈", dates:"21 марта — 19 апреля", week:{ general:"Начало декабря потребует решительности.", days:[["1 дек","Важный разговор."],["2 дек","Неожиданная встреча."],["3 дек","Финансовое планирование."],["4 дек","Недопонимание в отношениях."],["5 дек","Больше энергии."],["6 дек","Отдохни."],["7 дек","Планируй будущее."]], meta:["❤️ Любовь: инициатива"," Финансы: осторожно"," Карьера: новые проекты"," Совет: не путай уверенность с упрямством"," Число: 9"," Цвет: бордовый","⭐ Совместимость: Лев, Стрелец"] }, dark:"Ты привык действовать первым. Боишься не успеть. Вспыльчивость, нетерпимость. Сила: зажигать других." },

{ id:"taurus", name:"Телец", sym:"♉", dates:"20 апреля — 20 мая", week:{ general:"Желание стабильности.", days:[["1 дек","Наблюдай."],["2 дек","Сюрприз."],["3 дек","Рабочие задачи."],["4 дек","Романтика."],["5 дек","Самооценка."],["6 дек","Финансы."],["7 дек","Время с близкими."]], meta:["❤️ Любовь: стабильность"," Финансы: пересмотр"," Карьера: последовательность"," Совет: отпускай прошлое"," Число: 6"," Цвет: изумрудный","⭐ Совместимость: Дева, Козерог"] }, dark:"Умеешь создавать уют. Боишься перемен. Упрямство, собственничество. Сила: терпение." },

{ id:"gemini", name:"Близнецы", sym:"♊", dates:"21 мая — 20 июня", week:{ general:"Насыщенная неделя.", days:[["1 дек","Сообщение."],["2 дек","Знакомства."],["3 дек","Не раскрывай планы."],["4 дек","Разговор из прошлого."],["5 дек","Без эмоций."],["6 дек","Творчество."],["7 дек","Определись."]], meta:["❤️ Любовь: флирт"," Финансы: идея заработка"," Карьера: коммуникации"," Совет: молчание — золото"," Число: 5"," Цвет: жёлтый","⭐ Совместимость: Весы, Водолей"] }, dark:"Легко общаешься. Боишься остаться непонятым. Непостоянство. Сила: видеть разные стороны." },

{ id:"cancer", name:"Рак", sym:"♋", dates:"21 июня — 22 июля", week:{ general:"Задумайся о себе.", days:[["1 дек","Слушай ощущения."],["2 дек","Поддержка."],["3 дек","Отпусти обиды."],["4 дек","Укрепление отношений."],["5 дек","Не принимай на свой счёт."],["6 дек","Спокойствие."],["7 дек","Осознание."]], meta:["❤️ Любовь: проявляй чувства"," Финансы: без трат"," Карьера: не недооценивай"," Совет: забота о себе"," Число: 2"," Цвет: серебристый","⭐ Совместимость: Рыбы, Скорпион"] }, dark:"Заботишься о других. Боишься отвержения. Обидчивость. Сила: чуткость." },

{ id:"leo", name:"Лев", sym:"♌", dates:"23 июля — 22 августа", week:{ general:"В центре внимания.", days:[["1 дек","Заяви о желаниях."],["2 дек","Новые начинания."],["3 дек","Похвала."],["4 дек","Гордость."],["5 дек","Встречи."],["6 дек","Без соперничества."],["7 дек","Новые цели."]], meta:["❤️ Любовь: инициатива"," Финансы: без трат на других"," Карьера: покажи себя"," Совет: сила не в доказательствах"," Число: 1"," Цвет: золотой","⭐ Совместимость: Овен, Стрелец"] }, dark:"Яркий лидер. Боишься быть незамеченным. Гордость. Сила: вдохновлять." },

{ id:"virgo", name:"Дева", sym:"♍", dates:"23 августа — 22 сентября", week:{ general:"Наведи порядок.", days:[["1 дек","Разбери дела."],["2 дек","Не критикуй себя."],["3 дек","Работа."],["4 дек","Комплимент."],["5 дек","Чужие проблемы."],["6 дек","Здоровье."],["7 дек","Исправь ошибку."]], meta:["❤️ Любовь: искренность"," Финансы: бюджеты"," Карьера: внимательность"," Совет: идеального момента нет"," Число: 4"," Цвет: тёмно-зелёный","⭐ Совместимость: Телец, Козерог"] }, dark:"Видишь детали. Боишься несовершенства. Перфекционизм. Сила: ясность ума." },

{ id:"libra", name:"Весы", sym:"♎", dates:"23 сентября — 22 октября", week:{ general:"Время выбора.", days:[["1 дек","Не угождай всем."],["2 дек","Романтика."],["3 дек","Договорённость."],["4 дек","Без сомнений."],["5 дек","Встреча."],["6 дек","Без конфликтов."],["7 дек","Личные решения."]], meta:["❤️ Любовь: честность"," Финансы: без сомнительного"," Карьера: партнёрство"," Совет: выбор в свою пользу"," Число: 7"," Цвет: голубой","⭐ Совместимость: Близнецы, Водолей"] }, dark:"Ищешь баланс. Боишься выбрать. Нерешительность. Сила: дипломатия." },

{ id:"scorpio", name:"Скорпион", sym:"♏", dates:"23 октября — 21 ноября", week:{ general:"Разберись в чувствах.", days:[["1 дек","Детали."],["2 дек","Серьёзный разговор."],["3 дек","Ревность."],["4 дек","Поворот."],["5 дек","Откажись от привычки."],["6 дек","Идея."],["7 дек","Доверься опыту."]], meta:["❤️ Любовь: без проверок"," Финансы: без риска"," Карьера: долгосрок"," Совет: не все хотят зла"," Число: 8"," Цвет: тёмно-красный","⭐ Совместимость: Рак, Рыбы"] }, dark:"Скрываешь чувства. Боишься предательства. Подозрительность. Сила: восстанавливаться." },

{ id:"sagittarius", name:"Стрелец", sym:"♐", dates:"22 ноября — 21 декабря", week:{ general:"Новые возможности.", days:[["1 дек","Возможность."],["2 дек","Путешествия."],["3 дек","Не обещай лишнего."],["4 дек","Встреча."],["5 дек","Новое."],["6 дек","Финансы."],["7 дек","Итоги."]], meta:["❤️ Любовь: искренность"," Финансы: без трат"," Карьера: новые направления"," Совет: свобода — это ответственность"," Число: 3"," Цвет: фиолетовый","⭐ Совместимость: Овен, Лев"] }, dark:"Оптимист. Боишься обязательств. Непостоянство. Сила: вдохновлять." },

{ id:"capricorn", name:"Козерог", sym:"♑", dates:"22 декабря — 19 января", week:{ general:"Конкретные результаты.", days:[["1 дек","Цель."],["2 дек","Попроси помощи."],["3 дек","Работа."],["4 дек","Близкие."],["5 дек","Не сравнивай."],["6 дек","Праздник."],["7 дек","Привычки."]], meta:["❤️ Любовь: говори о чувствах"," Финансы: планирование"," Карьера: дисциплина"," Совет: отдых — часть успеха"," Число: 10"," Цвет: коричневый","⭐ Совместимость: Телец, Дева"] }, dark:"Идёшь к цели. Боишься слабости. Жёсткость. Сила: надёжность." },

{ id:"aquarius", name:"Водолей", sym:"♒", dates:"20 января — 18 февраля", week:{ general:"Нестандартность.", days:[["1 дек","Идея."],["2 дек","Друзья."],["3 дек","Критика."],["4 дек","Новость."],["5 дек","Попробуй."],["6 дек","Открытость."],["7 дек","Планы."]], meta:["❤️ Любовь: близость"," Финансы: рационально"," Карьера: нестандартность"," Совет: независимость != одиночество"," Число: 11"," Цвет: бирюзовый","⭐ Совместимость: Близнецы, Весы"] }, dark:"Мыслишь иначе. Боишься привязанности. Отстранённость. Сила: оригинальность." },

{ id:"pisces", name:"Рыбы", sym:"♓", dates:"19 февраля — 20 марта", week:{ general:"Самоанализ.", days:[["1 дек","Внутренний голос."],["2 дек","Творчество."],["3 дек","Чужая ответственность."],["4 дек","Романтика."],["5 дек","Прошлое."],["6 дек","Хобби."],["7 дек","Размышления."]], meta:["❤️ Любовь: открытость"," Финансы: без эмоций"," Карьера: творчество"," Совет: не идеализируй"," Число: 12"," Цвет: морской","⭐ Совместимость: Рак, Скорпион"] }, dark:"Чувствуешь глубоко. Боишься реальности. Идеализация. Сила: эмпатия." }

];

const FATE = {

"Овен": { theme: "Лидерство", strong: "Смелость", lesson: "Терпение" },

"Телец": { theme: "Стабильность", strong: "Надёжность", lesson: "Гибкость" },

"Близнецы": { theme: "Общение", strong: "Интеллект", lesson: "Постоянство" },

"Рак": { theme: "Семья", strong: "Забота", lesson: "Границы" },

"Лев": { theme: "Признание", strong: "Уверенность", lesson: "Скромность" },

"Дева": { theme: "Порядок", strong: "Аналитика", lesson: "Принятие" },

"Весы": { theme: "Гармония", strong: "Дипломатия", lesson: "Самостоятельность" },

"Скорпион": { theme: "Трансформация", strong: "Решительность", lesson: "Доверие" },

"Стрелец": { theme: "Свобода", strong: "Оптимизм", lesson: "Ответственность" },

"Козерог": { theme: "Достижения", strong: "Дисциплина", lesson: "Баланс" },

"Водолей": { theme: "Новаторство", strong: "Оригинальность", lesson: "Близость" },

"Рыбы": { theme: "Творчество", strong: "Эмпатия", lesson: "Реализм" }

};

const COMPAT = {

"Овен": { "Лев":"harmony", "Стрелец":"harmony", "Близнецы":"harmony", "Рак":"hard", "Козерог":"hard" },

"Телец": { "Дева":"harmony", "Козерог":"harmony", "Рак":"harmony", "Лев":"hard", "Водолей":"hard" },

"Близнецы": { "Весы":"harmony", "Водолей":"harmony", "Овен":"harmony", "Дева":"hard", "Рыбы":"hard" },

"Рак": { "Рыбы":"harmony", "Скорпион":"harmony", "Телец":"harmony", "Овен":"hard", "Весы":"hard" },

"Лев": { "Овен":"harmony", "Стрелец":"harmony", "Весы":"harmony", "Телец":"hard", "Скорпион":"hard" },

"Дева": { "Телец":"harmony", "Козерог":"harmony", "Скорпион":"harmony", "Близнецы":"hard", "Стрелец":"hard" },

"Весы": { "Близнецы":"harmony", "Водолей":"harmony", "Лев":"harmony", "Рак":"hard", "Козерог":"hard" },

"Скорпион": { "Рак":"harmony", "Рыбы":"harmony", "Дева":"harmony", "Лев":"hard", "Водолей":"hard" },

"Стрелец": { "Овен":"harmony", "Лев":"harmony", "Водолей":"harmony", "Дева":"hard", "Рыбы":"hard" },

"Козерог": { "Телец":"harmony", "Дева":"harmony", "Рыбы":"harmony", "Овен":"hard", "Весы":"hard" },

"Водолей": { "Близнецы":"harmony", "Весы":"harmony", "Стрелец":"harmony", "Телец":"hard", "Скорпион":"hard" },

"Рыбы": { "Рак":"harmony", "Скорпион":"harmony", "Козерог":"harmony", "Близнецы":"hard", "Стрелец":"hard" }

};

const TAROT = [

{ icon:"", name:"Солнце", meaning:"День обещает ясность." },

{ icon:"", name:"Луна", meaning:"Возможны сомнения." },

{ icon:"⭐", name:"Звезда", meaning:"Хороший знак для надежды." },

{ icon:"⚔️", name:"Справедливость", meaning:"День просит честности." },

{ icon:"", name:"Колесо Фортуны", meaning:"Перемены близко." }

];

const QDAY = [

"Не спеши, ответ уже внутри тебя.",

"Одно честное «нет» освободит время.",

"Присмотрись к мелочам.",

"Твой темп — правильный для тебя.",

"Позволь событиям идти своим чередом."

];

const ALL_NAMES = SIGNS.map(s => s.name);

function showTab(id, btn) {

document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));

document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));

document.getElementById(id).classList.add("active");

btn.classList.add("active");

if (id === "tarot") renderTarot();

if (id === "qday") renderQday();

}

function signButtons(containerId, onClick) {

document.getElementById(containerId).innerHTML = SIGNS.map(s =>

`<button class="sign-btn" onclick="(${onClick.name})('${s.id}')">${s.sym}<br>${s.name}</button>`

).join("");

}

function renderWeek(id) {

const s = SIGNS.find(x => x.id === id);

document.querySelectorAll("#weekSigns .sign-btn").forEach((b,i) => b.classList.toggle("active", SIGNS[i].id === id));

const days = s.week.days.map(d => `<div class="day"><b>${d[0]}</b><br>${d[1]}</div>`).join("");

const meta = s.week.meta.map(m => `<li>${m}</li>`).join("");

document.getElementById("weekContent").innerHTML = `<div class="week-title">${s.sym} ${s.name}</div><p>${s.week.general}</p>${days}<ul class="meta">${meta}</ul>`;

}

function renderDark(id) {

const s = SIGNS.find(x => x.id === id);

document.querySelectorAll("#darkSigns .sign-btn").forEach((b,i) => b.classList.toggle("active", SIGNS[i].id === id));

document.getElementById("darkContent").innerHTML = `<div class="week-title" style="color:#e07fb0">${s.sym} ${s.name}</div><p class="result-text">${s.dark}</p>`;

}

function renderFate(id) {

const s = SIGNS.find(x => x.id === id);

document.querySelectorAll("#fateSigns .sign-btn").forEach((b,i) => b.classList.toggle("active", SIGNS[i].id === id));

const f = FATE[s.name];

document.getElementById("fateContent").innerHTML = `<div class="week-title">${s.sym} ${s.name}</div><ul class="meta"><li> Тема: <b>${f.theme}</b></li><li> Сила: <b>${f.strong}</b></li><li> Урок: <b>${f.lesson}</b></li></ul>`;

}

signButtons("weekSigns", renderWeek); renderWeek("aries");

signButtons("darkSigns", renderDark); renderDark("aries");

signButtons("fateSigns", renderFate); renderFate("aries");

document.getElementById("signA").innerHTML = ALL_NAMES.map(n => `<option>${n}</option>`).join("");

document.getElementById("signB").innerHTML = ALL_NAMES.map(n => `<option>${n}</option>`).join("");

document.getElementById("signB").selectedIndex = 1;

function calcCompat() {

const a = document.getElementById("signA").value;

const b = document.getElementById("signB").value;

let type = "neutral";

if (COMPAT[a] && COMPAT[a][b]) type = COMPAT[a][b];

else if (COMPAT[b] && COMPAT[b][a]) type = COMPAT[b][a];

let base = [65, 60, 65, 70];

if (type === "harmony") base = [88, 92, 80, 85];

if (type === "hard") base = [45, 65, 40, 45];

const set = (id, v) => document.getElementById(id).style.width = v + "%";

set("bLove", base[0]); set("bPassion", base[1]); set("bMind", base[2]); set("bFriend", base[3]);

document.getElementById("compatText").innerText = type === "harmony" ? "Сильное притяжение. Дополняете друг друга." : type === "hard" ? "Непростой союз. Учитесь слышать." : "Спокойный союз.";

document.getElementById("compatResult").classList.remove("hidden");

}

function renderTarot() {

const i = Math.floor(Math.random() * TAROT.length);

document.getElementById("tIcon").innerText = TAROT[i].icon;

document.getElementById("tName").innerText = TAROT[i].name;

document.getElementById("tMeaning").innerText = TAROT[i].meaning;

}

function renderQday() {

const i = Math.floor(Math.random() * QDAY.length);

document.getElementById("qText").innerText = "«" + QDAY[i] + "»";

}

function nextQday() { renderQday(); }

</script>

</body>

</html>
