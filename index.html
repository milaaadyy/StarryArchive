<style>

* { box-sizing: border-box; margin: 0; padding: 0; }

body {

font-family: 'Segoe UI', Roboto, sans-serif;

background: radial-gradient(circle at 50% 0%, #2a1a4a 0%, #0d0820 70%, #05030f 100%);

color: #e9e4ff; padding: 30px 15px; min-height: 100vh;

position: relative; overflow-x: hidden;

}

body::before {

content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;

background-image: radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)), radial-gradient(1.5px 1.5px at 90px 40px, #c9a227, rgba(0,0,0,0));

background-repeat: repeat; background-size: 200px 200px; opacity: 0.3; z-index: -1; animation: twinkle 4s infinite alternate;

}

@keyframes twinkle { 0% { opacity: 0.2; } 100% { opacity: 0.5; } }

.app { max-width: 650px; margin: 0 auto; position: relative; z-index: 1; }

h1 { font-size: 28px; text-align: center; color: #f4e2a1; margin-bottom: 5px; text-shadow: 0 0 15px rgba(201,162,39,0.4); }

.tagline { text-align: center; color: #9a8fc0; font-size: 14px; margin-bottom: 15px; letter-spacing: 1px; }

.current-date { text-align: center; font-size: 13px; color: #c9a227; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; background: rgba(201,162,39,0.1); display: inline-block; padding: 5px 15px; border-radius: 20px; left: 50%; position: relative; transform: translateX(-50%); }

.tabs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 25px; }

.tab { padding: 10px 16px; border-radius: 20px; border: 1px solid #4a3a7a; background: rgba(255,255,255,0.03); color: #c9bfe8; cursor: pointer; transition: all 0.3s; font-size: 14px; }

.tab:hover { background: rgba(106,79,192,0.2); border-color: #8a6fe0; }

.tab.active { background: linear-gradient(135deg, #6a4fc0, #8a6fe0); color: #fff; border-color: #c9a227; box-shadow: 0 0 15px rgba(138,111,224,0.5); }

.panel { display: none; background: rgba(26, 18, 51, 0.85); padding: 24px; border-radius: 18px; border: 1px solid rgba(201, 162, 39, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 0 20px rgba(106,79,192,0.1); backdrop-filter: blur(10px); }

.panel.active { display: block; animation: fadeUp 0.4s ease-out; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.sign-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }

.sign-btn { padding: 12px 5px; border-radius: 12px; border: 1px solid #3d2f6b; background: rgba(0,0,0,0.2); color: #d9d0f5; cursor: pointer; text-align: center; font-size: 13px; transition: all 0.2s; position: relative; overflow: hidden; }

.sign-btn:hover { border-color: #8a6fe0; transform: translateY(-2px); }

.sign-btn.active { border-color: #c9a227; background: linear-gradient(135deg, rgba(201,162,39,0.2), rgba(201,162,39,0.05)); box-shadow: 0 0 10px rgba(201,162,39,0.3); color: #fff; }

/* Стихии (цветная полоска снизу) */

.element-line { position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; }

.el-fire { background: #ff5722; }

.el-water { background: #2196f3; }

.el-earth { background: #4caf50; }

.el-air { background: #ffeb3b; }

.week-title { font-size: 22px; color: #f4e2a1; margin-bottom: 15px; border-bottom: 1px solid rgba(201,162,39,0.2); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;}

.week-title span { font-size: 13px; color: #9a8fc0; font-weight: normal; }

.days-nav { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; }

.days-nav::-webkit-scrollbar { display: none; }

.day-btn { flex: 1; min-width: 55px; padding: 10px 5px; border-radius: 10px; border: 1px solid #3d2f6b; background: rgba(0,0,0,0.2); color: #9a8fc0; font-size: 12px; cursor: pointer; text-align: center; transition: all 0.2s; }

.day-btn.today { border-color: #c9a227; color: #c9a227; font-weight: bold; }

.day-btn.active { background: linear-gradient(135deg, #6a4fc0, #8a6fe0); color: #fff; border-color: #c9a227; box-shadow: 0 0 10px rgba(138,111,224,0.5); }

.day-btn .date-num { display: block; font-size: 18px; margin-top: 4px; font-weight: bold; }

.day-btn .month-name { display: block; font-size: 10px; text-transform: uppercase; }

.day-content { padding: 18px; border-left: 3px solid #c9a227; background: rgba(255,255,255,0.03); border-radius: 0 12px 12px 0; font-size: 15px; line-height: 1.6; margin-bottom: 15px; animation: fadeUp 0.3s ease-out; position: relative; }

.today-badge { display: inline-block; background: rgba(201,162,39,0.2); color: #c9a227; padding: 3px 8px; border-radius: 10px; font-size: 11px; margin-bottom: 8px; text-transform: uppercase; font-weight: bold; }

.meta-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }

.meta-tag { background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 8px; font-size: 13px; border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 5px; }

.meta-tag b { color: #c9a227; font-weight: 600; }

.zodiac-watermark { position: absolute; bottom: -10px; right: 10px; font-size: 80px; opacity: 0.05; pointer-events: none; line-height: 1; }

select { width: 100%; padding: 12px 15px; margin-bottom: 10px; background: rgba(0,0,0,0.3); color: #fff; border: 1px solid #4a3a7a; border-radius: 10px; font-size: 15px; outline: none; }

select:focus { border-color: #c9a227; }

.btn { padding: 14px; width: 100%; background: linear-gradient(135deg, #6a4fc0, #8a6fe0); color: #fff; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: 600; margin-top: 10px; transition: all 0.3s; box-shadow: 0 4px 15px rgba(106,79,192,0.3); display: flex; justify-content: center; align-items: center; gap: 8px;}

.btn:hover { filter: brightness(1.2); transform: translateY(-1px); }

.btn-gold { background: linear-gradient(135deg, #c9a227, #f4e2a1); color: #0d0820; box-shadow: 0 4px 15px rgba(201,162,39,0.3); }

.btn-gold:hover { filter: brightness(1.1); }

.bar-track { height: 8px; background: rgba(0,0,0,0.5); border-radius: 4px; margin: 5px 0 15px; overflow: hidden; }

.bar-fill { height: 100%; background: linear-gradient(90deg, #6a4fc0, #c9a227); width: 0; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }

.hidden { display: none; }

.qday-box { text-align: center; padding: 30px 20px; background: linear-gradient(135deg, rgba(106,79,192,0.2), rgba(201,162,39,0.1)); border-radius: 15px; font-size: 19px; color: #f4e2a1; margin-bottom: 20px; border: 1px solid rgba(201,162,39,0.3); font-style: italic; line-height: 1.6; box-shadow: inset 0 0 20px rgba(0,0,0,0.3); }

.tarot-card { width: 140px; height: 210px; margin: 0 auto 20px; border: 2px solid #c9a227; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 50px; background: linear-gradient(160deg, #1c1338, #2f1f5c); box-shadow: 0 0 30px rgba(201,162,39,0.2); position: relative; }

.tarot-card span { font-size: 16px; color: #fff; margin-top: 15px; font-weight: 500;}

.info-block { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px; margin-bottom: 10px; border-left: 2px solid #8a6fe0; }

.info-block h4 { color: #c9a227; font-size: 14px; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }

.info-block p { font-size: 14px; line-height: 1.5; }

.moon-icon { font-size: 80px; text-align: center; margin: 20px 0; filter: drop-shadow(0 0 20px rgba(255,255,255,0.4)); }

.fortune-box { text-align: center; padding: 30px; background: rgba(0,0,0,0.3); border-radius: 15px; border: 2px dashed #c9a227; margin-top: 20px; min-height: 150px; display: flex; flex-direction: column; justify-content: center; }

.fortune-box h3 { color: #f4e2a1; font-size: 20px; margin-bottom: 10px; }

.fortune-box p { font-size: 16px; line-height: 1.6; }

.share-btn { background: transparent; border: 1px solid #4a3a7a; color: #c9bfe8; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 13px; margin-top: 10px; display: inline-flex; align-items: center; gap: 5px; transition: 0.3s; }

.share-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

</style>

</head>

{ id:"gemini", name:"Близнецы", sym:"♊", el:"air", dates:"21 мая — 20 июня", week:{ general:"Насыщенная неделя.", days:["Сообщение может изменить планы.","Знакомства и общение.","Не раскрывай все планы.","Разговор с человеком из прошлого.","Без важных решений на эмоциях.","Творчество и эксперименты.","Определись, чего хочешь."], tags:["❤️ Любовь: флирт"," Финансы: идея заработка"," Карьера: коммуникации"," Совет: молчание — золото"," Число: 5"," Цвет: жёлтый"] }, dark:"Легкость — это щит. Боишься привязаться по-настоящему. Избегаешь сложных разговоров. Тёмная сторона — непостоянство. <b>Скрытая сила:</b> видеть ситуацию с разных сторон." },

{ id:"leo", name:"Лев", sym:"♌", el:"fire", dates:"23 июля — 22 августа", week:{ general:"В центре внимания.", days:["Заяви о своих желаниях.","Новые начинания.","Похвала за работу.","Не позволяй гордости испортить отношения.","Встречи и развлечения.","Без соперничества.","Новые цели."], tags:["❤️ Любовь: инициатива"," Финансы: без трат на других"," Карьера: покажи себя"," Совет: сила не в доказательствах"," Число: 1"," Цвет: золотой"] }, dark:"Зависимость от чужого одобрения. Боишься быть незамеченным. Тёмная сторона — высокомерие и драматизм. <b>Скрытая сила:</b> искренняя щедрость." },

{ id:"sagittarius", name:"Стрелец", sym:"♐", el:"fire", dates:"22 ноября — 21 декабря", week:{ general:"Новые возможности.", days:["Возможность изменить планы.","Путешествия и впечатления.","Не обещай лишнего.","Встреча с интересным человеком.","Попробуй новое.","Финансовые вопросы.","Итоги и планы."], tags:["❤️ Любовь: искренность"," Финансы: без трат"," Карьера: новые направления"," Совет: свобода — это ответственность"," Число: 3"," Цвет: фиолетовый"] }, dark:"Свобода как бегство от ответственности. Обещаешь горы, но исчезаешь. Тёмная сторона — инфантильность. <b>Скрытая сила:</b> видеть большую картину." },

function renderMoon() {

// Простое вычисление фазы луны (для развлекательных целей)

const date = new Date();

const synodicMonth = 29.53;

const knownNewMoon = new Date('2024-01-11');

const daysSince = (date - knownNewMoon) / (1000 * 60 * 60 * 24);

const phaseIndex = Math.floor(((daysSince % synodicMonth) / synodicMonth) * 8) % 8;

const phase = MOON_PHASES[phaseIndex];

document.getElementById("moonIcon").innerText = phase.icon;

document.getElementById("moonPhaseName").innerText = phase.name;

document.getElementById("moonDesc").innerText = phase.desc;

}
