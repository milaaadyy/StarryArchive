<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мистический гороскоп</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(circle at 50% 0%, #2a1a4a 0%, #0d0820 70%, #05030f 100%);
    color: #e9e4ff; padding: 24px 12px; min-height: 100vh;
  }
  .app { max-width: 600px; margin: 0 auto; }
  h1 { font-size: 26px; text-align: center; color: #f4e2a1; margin-bottom: 4px; }
  .tagline { text-align: center; color: #9a8fc0; font-size: 13px; margin-bottom: 16px; }
  .main-date {
    display: block; width: fit-content; margin: 0 auto 20px;
    font-size: 12px; color: #c9a227; text-transform: uppercase;
    background: #1a1233; padding: 5px 14px; border-radius: 15px;
    border: 1px solid #3d2f6b;
  }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
  .tab {
    padding: 8px 14px; border-radius: 16px; border: 1px solid #4a3a7a;
    background: transparent; color: #c9bfe8; cursor: pointer; font-size: 12px;
    transition: all .2s;
  }
  .tab:hover { border-color: #8a6fe0; }
  .tab.active { background: linear-gradient(135deg, #6a4fc0, #8a6fe0); color: #fff; border-color: #c9a227; }

  .panel {
    display: none; background: #1a1233; padding: 20px 16px;
    border-radius: 15px; border: 1px solid #3d2f6b;
  }
  .panel.active { display: block; animation: fadeUp .3s ease-out; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .sign-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 16px; }
  .sign-btn {
    padding: 10px 2px; border-radius: 8px; border: 1px solid #3d2f6b;
    background: #0d0820; color: #d9d0f5; cursor: pointer;
    text-align: center; font-size: 11px; transition: all .2s;
  }
  .sign-btn:hover { border-color: #8a6fe0; }
  .sign-btn.active { border-color: #c9a227; background: #2a1a4a; color: #fff; box-shadow: 0 0 10px rgba(201,162,39,.3); }
  .el-fire { border-bottom: 2px solid #ff5722; }
  .el-water { border-bottom: 2px solid #2196f3; }
  .el-earth { border-bottom: 2px solid #4caf50; }
  .el-air { border-bottom: 2px solid #ffeb3b; }

  .week-title {
    font-size: 18px; color: #f4e2a1; margin-bottom: 10px;
    border-bottom: 1px solid #3d2f6b; padding-bottom: 8px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .week-title span { font-size: 11px; color: #9a8fc0; }

  .days-nav { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
  .days-nav::-webkit-scrollbar { display: none; }
  .day-btn {
    flex: 1; min-width: 46px; padding: 8px 3px; border-radius: 8px;
    border: 1px solid #3d2f6b; background: #0d0820; color: #9a8fc0;
    font-size: 10px; cursor: pointer; text-align: center; transition: all .2s;
  }
  .day-btn.today { border-color: #c9a227; color: #c9a227; }
  .day-btn.active { background: linear-gradient(135deg, #6a4fc0, #8a6fe0); color: #fff; border-color: #c9a227; }
  .day-btn .date-num { display: block; font-size: 15px; font-weight: bold; margin-top: 1px; }
  .day-btn .date-mon { display: block; font-size: 9px; color: #9a8fc0; text-transform: lowercase; }
  .day-btn.today .date-mon { color: #c9a227; }

  .day-content {
    padding: 15px; border-left: 3px solid #c9a227; background: #2a1a4a;
    border-radius: 0 8px 8px 0; font-size: 13px; line-height: 1.55;
    margin-bottom: 12px; position: relative;
  }
  .today-badge {
    display: inline-block; background: #c9a227; color: #0d0820;
    padding: 2px 7px; border-radius: 5px; font-size: 10px;
    margin-bottom: 6px; font-weight: bold; text-transform: uppercase;
  }
  .zodiac-watermark { position: absolute; bottom: 0; right: 8px; font-size: 64px; opacity: .08; pointer-events: none; }

  .meta-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .meta-tag { background: #0d0820; padding: 6px 10px; border-radius: 6px; font-size: 11px; border: 1px solid #3d2f6b; }

  .share-btn {
    padding: 8px 14px; background: transparent; color: #c9a227;
    border: 1px solid #c9a227; border-radius: 8px; cursor: pointer;
    font-size: 12px; margin-bottom: 6px;
  }
  .share-btn:hover { background: rgba(201,162,39,.1); }

  .infographic {
    margin: 14px 0; padding: 14px; background: #0d0820;
    border: 1px solid #3d2f6b; border-radius: 12px;
    display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: center;
  }
  .ring-wrap { position: relative; width: 120px; height: 120px; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-bg { stroke: rgba(255,255,255,.07); }
  .ring-fg { stroke: #c9a227; stroke-linecap: round; transition: stroke-dashoffset 1s ease-out; }
  .ring-label {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .ring-label b { font-size: 22px; color: #f4e2a1; line-height: 1; }
  .ring-label small { font-size: 9px; color: #9a8fc0; text-transform: uppercase; margin-top: 3px; }
  .stats { display: flex; flex-direction: column; gap: 8px; }
  .stat-row { font-size: 11px; }
  .stat-head { display: flex; justify-content: space-between; margin-bottom: 3px; color: #c9bfe8; }
  .stat-head b { color: #f4e2a1; }
  .stat-track { height: 5px; background: #000; border-radius: 3px; overflow: hidden; }
  .stat-fill {
    height: 100%; width: 0; border-radius: 3px;
    background: linear-gradient(90deg, #6a4fc0, #c9a227);
    transition: width 1s ease-out;
  }
  @media (max-width: 420px) {
    .infographic { grid-template-columns: 1fr; justify-items: center; }
    .stats { width: 100%; }
  }

  select {
    width: 100%; padding: 11px; margin-bottom: 8px; background: #0d0820;
    color: #fff; border: 1px solid #4a3a7a; border-radius: 8px; font-size: 14px;
  }
  select:focus { outline: none; border-color: #c9a227; }
  .btn {
    padding: 12px; width: 100%; background: linear-gradient(135deg, #6a4fc0, #8a6fe0);
    color: #fff; border: none; border-radius: 8px; cursor: pointer;
    font-size: 14px; font-weight: 600; margin-top: 8px; transition: all .2s;
  }
  .btn:hover { filter: brightness(1.15); }
  .btn-gold { background: linear-gradient(135deg, #c9a227, #e0b84a); color: #0d0820; }

  .bar-track { height: 7px; background: #0d0820; border-radius: 4px; margin: 4px 0 10px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, #6a4fc0, #c9a227); width: 0; transition: width 1s cubic-bezier(.4,0,.2,1); }
  .hidden { display: none; }

  .info-block {
    background: #0d0820; padding: 12px; border-radius: 8px;
    margin-bottom: 8px; border-left: 2px solid #8a6fe0;
  }
  .info-block h4 { color: #c9a227; font-size: 12px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .5px; }
  .info-block p { font-size: 13px; line-height: 1.45; }

  .tarot-card {
    width: 130px; height: 190px; margin: 0 auto 16px;
    border: 2px solid #c9a227; border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 42px; background: linear-gradient(160deg, #1c1338, #2f1f5c);
    box-shadow: 0 0 30px rgba(201,162,39,.2);
  }
  .tarot-card span { font-size: 14px; color: #fff; margin-top: 12px; }
  .moon-icon { font-size: 64px; text-align: center; margin: 16px 0; }

  .wheel-container { position: relative; width: 210px; height: 210px; margin: 20px auto 30px; }
  .wheel-pointer {
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    font-size: 24px; z-index: 10; color: #c9a227;
  }
  .wheel {
    width: 100%; height: 100%; border-radius: 50%; border: 3px solid #c9a227;
    position: relative; overflow: hidden; transition: transform 5s cubic-bezier(.17,.67,.2,1);
  }
  .wheel-center {
    position: absolute; top: 50%; left: 50%; width: 34px; height: 34px;
    background: #0d0820; border: 2px solid #c9a227; border-radius: 50%;
    transform: translate(-50%,-50%); z-index: 5;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .segment {
    position: absolute; width: 50%; height: 50%; transform-origin: 100% 100%;
    border: 1px solid #3d2f6b; display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: #fff;
  }
  .segment span { transform: rotate(45deg); }
  .seg-even { background: #1c1338; }
  .seg-odd { background: #2a1a4a; }

  .fortune-result {
    text-align: center; padding: 15px; background: #2a1a4a;
    border-radius: 10px; border: 1px dashed #c9a227; margin-top: 15px;
    animation: fadeUp .3s ease-out;
  }
</style>
</head>
<body>
<div class="app">
  <h1>🔮 Мистический гороскоп</h1>
  <p class="tagline">Твой проводник в мир астрологии</p>
  <span class="main-date" id="mainDate"></span>

  <div class="tabs">
    <button class="tab active" data-tab="week">Неделя</button>

    <button class="tab" data-tab="dark">Тёмная</button>

    <button class="tab" data-tab="moon">Луна</button>
    <button class="tab" data-tab="fortune">Удача</button>
  </div>

  <div id="week" class="panel active">
    <div class="sign-grid" id="weekSigns"></div>
    <div id="weekContent"></div>
  </div>

  <div id="compat" class="panel">
    <select id="signA"></select>
    <select id="signB"></select>
    <button class="btn" id="btnCompat">Проверить совместимость</button>
    <div id="compatResult" class="hidden" style="margin-top:16px;">
      <div style="font-size:12px;">❤️ Любовь <div class="bar-track"><div class="bar-fill" id="bLove"></div></div></div>
      <div style="font-size:12px;">🔥 Страсть <div class="bar-track"><div class="bar-fill" id="bPassion"></div></div></div>
      <div style="font-size:12px;">🧠 Понимание <div class="bar-track"><div class="bar-fill" id="bMind"></div></div></div>
      <div style="font-size:12px;">🤝 Дружба <div class="bar-track"><div class="bar-fill" id="bFriend"></div></div></div>
      <div class="info-block" style="margin-top:12px; border-color:#c9a227;">
        <h4>Вердикт астролога</h4>
        <p id="compatText"></p>
      </div>
    </div>
  </div>

  <div id="dark" class="panel">
    <div class="sign-grid" id="darkSigns"></div>
    <div id="darkContent"></div>
  </div>

  <div id="fate" class="panel">
    <div class="sign-grid" id="fateSigns"></div>
    <div id="fateContent"></div>
  </div>

  <div id="tarot" class="panel" style="text-align:center;">
    <div class="tarot-card" id="tCard"><span id="tIcon">🌙</span><span id="tName"></span></div>
    <div id="tarotDetails" style="text-align:left;"></div>
  </div>

  <div id="moon" class="panel" style="text-align:center;">
    <div class="moon-icon" id="moonIcon">🌕</div>
    <h3 style="color:#f4e2a1; font-size:18px; margin-bottom:8px;" id="moonPhaseName"></h3>
    <p style="font-size:13px; color:#c9bfe8;" id="moonDesc"></p>
  </div>

  <div id="fortune" class="panel">
    <div class="wheel-container">
      <div class="wheel-pointer">▼</div>
      <div class="wheel" id="wheel"><div id="wheelInner" style="width:100%; height:100%; position:relative;"></div></div>
      <div class="wheel-center">✨</div>
    </div>
    <button class="btn btn-gold" id="btnSpin">Крутить колесо</button>
    <div id="fortuneResult" class="fortune-result hidden">
      <h3 id="fSign" style="color:#f4e2a1; font-size:16px; margin-bottom:6px;"></h3>
      <p id="fText" style="font-size:13px;"></p>
    </div>
  </div>
</div>

  { icon:"⭐", name:"Звезда", m:"Надежда, вдохновение и исцеление.", a:"Загадай желание и сделай первый шаг.", v:"Не падай духом из-за мелочей." },

  { icon:"🌑", n:"Новолуние", d:"Время планирования и закладки намерений." },
  { icon:"🌒", n:"Растущая", d:"Хорошее время для начинаний." },
  { icon:"🌓", n:"Первая четверть", d:"Возможны препятствия — не сдавайся." },

  { icon:"🌘", n:"Убывающая", d:"Отдых и восстановление сил." }
];

const DAYS_SHORT = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const MONTHS_SHORT = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];

/* ========== ДАТЫ ========== */
const today = new Date();
const todayIdx = (today.getDay() + 6) % 7;
const monday = new Date(today);
monday.setHours(0,0,0,0);
monday.setDate(today.getDate() - todayIdx);

document.getElementById("mainDate").textContent =
  today.toLocaleDateString("ru-RU", { day:"numeric", month:"long", year:"numeric" });

/* ========== СОСТОЯНИЕ ========== */
let curSign = "aries";
let curDay = todayIdx;
let isSpin = false;
let rot = 0;

/* ========== ВКЛАДКИ ========== */
document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    const id = btn.dataset.tab;
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(id).classList.add("active");
    if (id === "tarot") renderTarot();
    if (id === "moon") renderMoon();
  });
});

/* ========== КНОПКИ ЗНАКОВ ========== */
function buildSignButtons(containerId, renderFn) {
  const box = document.getElementById(containerId);
  box.innerHTML = "";
  SIGNS.forEach(s => {
    const b = document.createElement("button");
    b.className = "sign-btn el-" + s.el;
    b.dataset.sign = s.id;
    b.innerHTML = s.sym + "<br>" + s.name;
    b.addEventListener("click", () => renderFn(s.id));
    box.appendChild(b);
  });
}

function setActiveSign(containerId, id) {
  document.querySelectorAll("#" + containerId + " .sign-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.sign === id);
  });
}

/* ========== НЕДЕЛЯ ========== */
function renderWeek(id) {
  curSign = id;
  const s = SIGNS.find(x => x.id === id);
  setActiveSign("weekSigns", id);

  let nav = '<div class="days-nav">';
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    nav += `<button class="day-btn ${i === todayIdx ? "today" : ""} ${i === curDay ? "active" : ""}" data-day="${i}">
      ${DAYS_SHORT[i]}
      <span class="date-num">${d.getDate()}</span>
      <span class="date-mon">${MONTHS_SHORT[d.getMonth()]}</span>
    </button>`;
  }
  nav += "</div>";

  const st = s.stats;
  const power = Math.round((st.energy + st.love + st.money + st.intuition) / 4);
  const R = 50;
  const CIRC = 2 * Math.PI * R;
  const offset = CIRC - (power / 100) * CIRC;

  const statRow = (label, val) => `
    <div class="stat-row">
      <div class="stat-head"><span>${label}</span><b>${val}%</b></div>
      <div class="stat-track"><div class="stat-fill" data-w="${val}"></div></div>
    </div>`;

  const tagsHtml = s.week.tags.map(t => `<div class="meta-tag">${t}</div>`).join("");

  document.getElementById("weekContent").innerHTML = `
    <div class="week-title"><div>${s.sym} ${s.name}</div><span>${s.dates}</span></div>
    <p style="margin-bottom:12px;font-size:12px;line-height:1.5;color:#c9bfe8;">${s.week.general}</p>
    ${nav}
    <div class="day-content">
      <div class="zodiac-watermark">${s.sym}</div>
      ${curDay === todayIdx ? '<div class="today-badge">Сегодня</div>' : ""}
      <div>${s.week.days[curDay]}</div>
    </div>
    <div class="infographic">
      <div class="ring-wrap">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="${R}" fill="none" stroke-width="8"/>
          <circle class="ring-fg" cx="60" cy="60" r="${R}" fill="none" stroke-width="8"
            stroke-dasharray="${CIRC.toFixed(1)}"
            stroke-dashoffset="${CIRC.toFixed(1)}"
            data-offset="${offset.toFixed(1)}"/>
        </svg>
        <div class="ring-label"><b>${power}%</b><small>сила недели</small></div>
      </div>
      <div class="stats">
        ${statRow("⚡ Энергия", st.energy)}
        ${statRow("❤️ Любовь", st.love)}
        ${statRow("💰 Финансы", st.money)}
        ${statRow("🔮 Интуиция", st.intuition)}
      </div>
    </div>
    <button class="share-btn" id="btnShare">Поделиться</button>
    <div class="meta-tags">${tagsHtml}</div>
  `;

  document.querySelectorAll("#weekContent .day-btn").forEach(b => {
    b.addEventListener("click", () => {
      curDay = +b.dataset.day;
      renderWeek(curSign);
    });
  });
  document.getElementById("btnShare").addEventListener("click", shareGoroscope);

  requestAnimationFrame(() => {
    document.querySelectorAll("#weekContent .stat-fill").forEach(el => {
      el.style.width = el.dataset.w + "%";
    });
    const ring = document.querySelector("#weekContent .ring-fg");
    if (ring) ring.style.strokeDashoffset = ring.dataset.offset;
  });
}

function shareGoroscope() {
  const s = SIGNS.find(x => x.id === curSign);
  const text = `Мой гороскоп: ${s.week.days[curDay]}`;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => alert("Скопировано!")).catch(() => alert(text));
  } else {
    alert(text);
  }
}

/* ========== ТЁМНАЯ ========== */
function renderDark(id) {
  const s = SIGNS.find(x => x.id === id);
  setActiveSign("darkSigns", id);
  document.getElementById("darkContent").innerHTML = `
    <div class="week-title"><div>${s.sym} ${s.name}</div></div>
    <div class="info-block" style="border-color:#e07fb0;"><p>${s.dark}</p></div>
  `;
}

/* ========== СУДЬБА ========== */
function renderFate(id) {
  const s = SIGNS.find(x => x.id === id);
  setActiveSign("fateSigns", id);
  const f = FATE[s.name];
  document.getElementById("fateContent").innerHTML = `
    <div class="week-title"><div>${s.sym} ${s.name}</div></div>
    <div class="info-block"><h4>Главная тема</h4><p><b>${f.theme[0]}:</b> ${f.theme[1]}</p></div>
    <div class="info-block"><h4>Сильная сторона</h4><p><b>${f.strong[0]}:</b> ${f.strong[1]}</p></div>
    <div class="info-block"><h4>Главный урок</h4><p><b>${f.lesson[0]}:</b> ${f.lesson[1]}</p></div>
  `;
}

/* ========== СОВМЕСТИМОСТЬ ========== */
const NAMES = SIGNS.map(s => s.name);
const selA = document.getElementById("signA");
const selB = document.getElementById("signB");
NAMES.forEach(n => {
  selA.add(new Option(n, n));
  selB.add(new Option(n, n));
});
selB.selectedIndex = 1;

document.getElementById("btnCompat").addEventListener("click", calcCompat);

function calcCompat() {
  const a = selA.value;
  const b = selB.value;
  let type = "n";
  if (COMPAT[a] && COMPAT[a][b]) type = COMPAT[a][b];
  else if (COMPAT[b] && COMPAT[b][a]) type = COMPAT[b][a];

  const base = type === "h" ? [88, 92, 80, 85]
             : type === "x" ? [45, 65, 40, 45]
             : [65, 60, 65, 70];
  const text = type === "h"
    ? "Сильное притяжение. Вы способны дополнять друг друга, но иногда взгляды различаются. Секрет гармонии — принимать особенности, не пытаясь переделать."
    : type === "x"
    ? "Непростой союз: взгляды часто расходятся. Но именно через различия вы способны сильно вырасти. Главное — не пытаться переделать партнёра."
    : "Спокойное, ровное сочетание. Ярких вспышек нет, но есть устойчивость. Всё зависит от готовности вкладываться и идти на компромиссы.";

  document.getElementById("bLove").style.width = base[0] + "%";
  document.getElementById("bPassion").style.width = base[1] + "%";
  document.getElementById("bMind").style.width = base[2] + "%";
  document.getElementById("bFriend").style.width = base[3] + "%";
  document.getElementById("compatText").textContent = text;
  document.getElementById("compatResult").classList.remove("hidden");
}

/* ========== ТАРО ========== */
function renderTarot() {
  const t = TAROT[Math.floor(Math.random() * TAROT.length)];
  document.getElementById("tIcon").textContent = t.icon;
  document.getElementById("tName").textContent = t.name;
  document.getElementById("tarotDetails").innerHTML = `
    <div class="info-block"><h4>Значение</h4><p>${t.m}</p></div>
    <div class="info-block" style="border-color:#4caf50;"><h4>✨ Пожелание</h4><p>${t.a}</p></div>
    <div class="info-block" style="border-color:#f44336;"><h4>⚠️ Избегать</h4><p>${t.v}</p></div>
  `;
}

/* ========== ЛУНА ========== */
function renderMoon() {
  const days = (new Date() - new Date("2024-01-11")) / 86400000;
  const idx = Math.floor(((days % 29.53) / 29.53) * 8) % 8;
  const ph = MOON[idx];
  document.getElementById("moonIcon").textContent = ph.icon;
  document.getElementById("moonPhaseName").textContent = ph.n;
  document.getElementById("moonDesc").textContent = ph.d;
}

/* ========== КОЛЕСО УДАЧИ ========== */
function buildWheel() {
  const inner = document.getElementById("wheelInner");
  inner.innerHTML = "";
  SIGNS.forEach((s, i) => {
    const seg = document.createElement("div");
    seg.className = "segment " + (i % 2 === 0 ? "seg-even" : "seg-odd");
    seg.style.transform = `rotate(${i * 30}deg)`;
    seg.innerHTML = `<span>${s.sym}</span>`;
    inner.appendChild(seg);
  });
}
buildWheel();

document.getElementById("btnSpin").addEventListener("click", spinWheel);

function spinWheel() {
  if (isSpin) return;
  isSpin = true;
  document.getElementById("fortuneResult").classList.add("hidden");

  const idx = Math.floor(Math.random() * 12);
  const targetAngle = 360 * 5 + (360 - idx * 30);
  rot += targetAngle;
  document.getElementById("wheel").style.transform = `rotate(${rot}deg)`;

  setTimeout(() => {
    isSpin = false;
    const s = SIGNS[idx];
    document.getElementById("fSign").textContent = `Послание от ${s.name} ${s.sym}`;
    document.getElementById("fText").textContent = s.week.days[Math.floor(Math.random() * 7)];
    document.getElementById("fortuneResult").classList.remove("hidden");
  }, 5100);
}

/* ========== ИНИЦИАЛИЗАЦИЯ ========== */
buildSignButtons("weekSigns", renderWeek);
buildSignButtons("darkSigns", renderDark);
buildSignButtons("fateSigns", renderFate);

renderWeek(curSign);
renderDark("aries");
renderFate("aries");
</script>
