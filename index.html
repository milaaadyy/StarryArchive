<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мистический гороскоп</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Montserrat', sans-serif;
    background: #0d0820;
    color: #e9e4ff; padding: 24px 12px; min-height: 100vh;
    overflow-x: hidden;
  }
  
  /* Анимированный космический фон */
  body::before {
    content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 0%, #2a1a4a 0%, #0d0820 60%, #05030f 100%);
    z-index: -2;
  }
  body::after {
    content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background-image: 
      radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)), 
      radial-gradient(1.5px 1.5px at 100px 70px, #c9a227, rgba(0,0,0,0)),
      radial-gradient(1px 1px at 150px 150px, #fff, rgba(0,0,0,0));
    background-size: 250px 250px; opacity: 0.4; z-index: -1;
    animation: twinkle 4s infinite alternate;
  }
  @keyframes twinkle { 0% { opacity: 0.2; } 100% { opacity: 0.5; } }

  .app { max-width: 640px; margin: 0 auto; position: relative; z-index: 1; }
  
  h1 { font-size: 28px; text-align: center; color: #f4e2a1; margin-bottom: 4px; text-shadow: 0 0 15px rgba(201,162,39,0.4); }
  .tagline { text-align: center; color: #9a8fc0; font-size: 12px; margin-bottom: 16px; letter-spacing: 1px; text-transform: uppercase; }
  
  .main-date {
    display: block; width: fit-content; margin: 0 auto 20px;
    font-size: 12px; color: #c9a227; text-transform: uppercase;
    background: rgba(26,18,51,0.8); padding: 6px 16px; border-radius: 20px;
    border: 1px solid rgba(201,162,39,0.3); backdrop-filter: blur(5px);
  }

  /* Личный профиль (Дата рождения) */
  .profile-bar {
    background: linear-gradient(135deg, rgba(106,79,192,0.2), rgba(201,162,39,0.1));
    border: 1px solid rgba(201,162,39,0.3); border-radius: 12px;
    padding: 12px 16px; margin-bottom: 20px; display: flex;
    justify-content: space-between; align-items: center; font-size: 13px;
  }
  .profile-bar b { color: #f4e2a1; }
  .profile-bar button {
    background: none; border: 1px solid #8a6fe0; color: #c9bfe8;
    padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 11px;
  }
  .profile-bar button:hover { background: #8a6fe0; color: #fff; }
  .setup-birth { text-align: center; padding: 30px 10px; background: rgba(26,18,51,0.9); border-radius: 15px; border: 1px dashed #8a6fe0; margin-bottom: 20px; }
  .setup-birth h3 { color: #f4e2a1; margin-bottom: 10px; font-size: 18px; }
  .setup-birth p { font-size: 13px; color: #9a8fc0; margin-bottom: 15px; }
  .setup-birth input { padding: 10px; border-radius: 8px; border: 1px solid #4a3a7a; background: #0d0820; color: #fff; font-family: inherit; font-size: 14px; margin-bottom: 10px; width: 100%; max-width: 200px; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 24px; }
  .tab {
    padding: 10px 14px; border-radius: 20px; border: 1px solid #4a3a7a;
    background: rgba(255,255,255,0.02); color: #c9bfe8; cursor: pointer; font-size: 12px;
    transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .tab:hover { border-color: #8a6fe0; background: rgba(106,79,192,0.1); transform: translateY(-1px); }
  .tab.active { 
    background: linear-gradient(135deg, #6a4fc0, #8a6fe0); color: #fff; 
    border-color: #c9a227; box-shadow: 0 4px 15px rgba(138,111,224,0.4); 
  }

  .panel {
    display: none; background: rgba(26,18,51,0.85); padding: 22px 18px;
    border-radius: 18px; border: 1px solid rgba(201,162,39,0.2);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(106,79,192,0.1);
    backdrop-filter: blur(10px);
  }
  .panel.active { display: block; animation: fadeUp .4s ease-out; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

  .sign-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
  .sign-btn {
    padding: 12px 4px; border-radius: 12px; border: 1px solid #3d2f6b;
    background: rgba(0,0,0,0.2); color: #d9d0f5; cursor: pointer;
    text-align: center; font-size: 11px; transition: all .2s;
    font-family: inherit;
  }
  .sign-btn:hover { border-color: #8a6fe0; transform: translateY(-2px); }
  .sign-btn.active { 
    border-color: #c9a227; background: linear-gradient(135deg, rgba(201,162,39,0.15), rgba(201,162,39,0.05)); 
    box-shadow: 0 0 15px rgba(201,162,39,0.2); color: #fff; 
  }
  .el-fire { border-bottom: 2px solid #ff5722; }
  .el-water { border-bottom: 2px solid #2196f3; }
  .el-earth { border-bottom: 2px solid #4caf50; }
  .el-air { border-bottom: 2px solid #ffeb3b; }

  .week-title {
    font-size: 20px; color: #f4e2a1; margin-bottom: 12px;
    border-bottom: 1px solid rgba(201,162,39,0.2); padding-bottom: 10px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .week-title span { font-size: 12px; color: #9a8fc0; }

  .days-nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; }
  .days-nav::-webkit-scrollbar { display: none; }
  .day-btn {
    flex: 1; min-width: 50px; padding: 10px 4px; border-radius: 10px;
    border: 1px solid #3d2f6b; background: rgba(0,0,0,0.2); color: #9a8fc0;
    font-size: 10px; cursor: pointer; text-align: center; transition: all .3s;
    font-family: inherit;
  }
  .day-btn.today { border-color: #c9a227; color: #c9a227; }
  .day-btn.active { background: linear-gradient(135deg, #6a4fc0, #8a6fe0); color: #fff; border-color: #c9a227; box-shadow: 0 0 12px rgba(138,111,224,0.4); transform: translateY(-2px); }
  .day-btn .date-num { display: block; font-size: 16px; font-weight: bold; margin-top: 2px; }
  .day-btn .date-mon { display: block; font-size: 9px; color: #9a8fc0; text-transform: lowercase; margin-top: 1px; }
  .day-btn.today .date-mon { color: #c9a227; }

  .day-content {
    padding: 18px; border-left: 3px solid #c9a227; background: rgba(255,255,255,0.02);
    border-radius: 0 12px 12px 0; font-size: 14px; line-height: 1.6;
    margin-bottom: 15px; position: relative; animation: fadeUp 0.3s ease-out;
  }
  .today-badge {
    display: inline-block; background: rgba(201,162,39,0.2); color: #c9a227;
    padding: 3px 8px; border-radius: 6px; font-size: 10px;
    margin-bottom: 8px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .zodiac-watermark { position: absolute; bottom: -5px; right: 10px; font-size: 70px; opacity: 0.05; pointer-events: none; }

  .meta-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .meta-tag { background: rgba(0,0,0,0.3); padding: 6px 12px; border-radius: 8px; font-size: 11px; border: 1px solid rgba(255,255,255,0.05); }

  .share-btn {
    padding: 8px 16px; background: transparent; color: #c9a227;
    border: 1px solid #c9a227; border-radius: 8px; cursor: pointer;
    font-size: 12px; margin-bottom: 8px; transition: all .2s; font-family: inherit;
  }
  .share-btn:hover { background: rgba(201,162,39,0.1); }

  .infographic {
    margin: 16px 0; padding: 16px; background: rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.05); border-radius: 14px;
    display: grid; grid-template-columns: 130px 1fr; gap: 16px; align-items: center;
  }
  .ring-wrap { position: relative; width: 130px; height: 130px; margin: 0 auto; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-bg { stroke: rgba(255,255,255,0.06); }
  .ring-fg { stroke: #c9a227; stroke-linecap: round; transition: stroke-dashoffset 1.5s ease-out; filter: drop-shadow(0 0 5px rgba(201,162,39,0.5)); }
  .ring-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-label b { font-size: 26px; color: #f4e2a1; line-height: 1; }
  .ring-label small { font-size: 9px; color: #9a8fc0; text-transform: uppercase; margin-top: 4px; letter-spacing: 0.5px; }
  
  .stats { display: flex; flex-direction: column; gap: 10px; }
  .stat-row { font-size: 11px; }
  .stat-head { display: flex; justify-content: space-between; margin-bottom: 4px; color: #c9bfe8; }
  .stat-head b { color: #f4e2a1; }
  .stat-track { height: 6px; background: rgba(0,0,0,0.5); border-radius: 3px; overflow: hidden; }
  .stat-fill { height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, #6a4fc0, #c9a227); transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
  @media (max-width: 450px) {
    .infographic { grid-template-columns: 1fr; }
    .stats { width: 100%; }
  }

  select {
    width: 100%; padding: 12px 14px; margin-bottom: 10px; background: rgba(0,0,0,0.3);
    color: #fff; border: 1px solid #4a3a7a; border-radius: 10px; font-size: 14px; font-family: inherit;
  }
  select:focus { outline: none; border-color: #c9a227; }
  .btn {
    padding: 14px; width: 100%; background: linear-gradient(135deg, #6a4fc0, #8a6fe0);
    color: #fff; border: none; border-radius: 10px; cursor: pointer;
    font-size: 14px; font-weight: 600; margin-top: 10px; transition: all .3s;
    box-shadow: 0 4px 15px rgba(106,79,192,0.3); font-family: inherit;
  }
  .btn:hover { filter: brightness(1.15); transform: translateY(-2px); }
  .btn-gold { background: linear-gradient(135deg, #c9a227, #e0b84a); color: #0d0820; box-shadow: 0 4px 15px rgba(201,162,39,0.3); }

  .bar-track { height: 8px; background: rgba(0,0,0,0.5); border-radius: 4px; margin: 5px 0 12px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, #6a4fc0, #c9a227); width: 0; transition: width 1s cubic-bezier(.4,0,.2,1); }
  .hidden { display: none !important; }

  .info-block { background: rgba(0,0,0,0.2); padding: 14px; border-radius: 10px; margin-bottom: 10px; border-left: 3px solid #8a6fe0; }
  .info-block h4 { color: #c9a227; font-size: 12px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .info-block p { font-size: 13px; line-height: 1.5; }

  .tarot-card {
    width: 140px; height: 210px; margin: 0 auto 20px;
    border: 2px solid #c9a227; border-radius: 15px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 54px; background: linear-gradient(160deg, #1c1338, #2f1f5c);
    box-shadow: 0 0 40px rgba(201,162,39,0.15); position: relative;
    transition: transform 0.3s;
  }
  .tarot-card:hover { transform: translateY(-5px) rotate(2deg); }
  .tarot-card::after { content: "✨"; position: absolute; top: 12px; right: 12px; font-size: 16px; opacity: 0.6; }
  .tarot-card span { font-size: 15px; color: #fff; margin-top: 15px; font-weight: 600; text-align: center; padding: 0 10px; }
  .moon-icon { font-size: 70px; text-align: center; margin: 20px 0; filter: drop-shadow(0 0 20px rgba(255,255,255,0.2)); }

  /* Колесо */
  .wheel-container { position: relative; width: 240px; height: 240px; margin: 25px auto 30px; }
  .wheel-pointer { 
    position: absolute; top: -18px; left: 50%; transform: translateX(-50%); 
    font-size: 32px; z-index: 10; color: #c9a227; 
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6)); 
  }
  .wheel { 
    width: 100%; height: 100%; border-radius: 50%; border: 4px solid #c9a227; 
    position: relative; overflow: hidden; 
    transition: transform 6s cubic-bezier(0.15, 0.9, 0.2, 1); /* Более плавное замедление */
    box-shadow: 0 0 40px rgba(201,162,39,0.2), inset 0 0 20px rgba(0,0,0,0.8); 
  }
  .wheel.spinning { filter: blur(1px); }
  .wheel-center { 
    position: absolute; top: 50%; left: 50%; width: 44px; height: 44px; 
    background: #0d0820; border: 3px solid #c9a227; border-radius: 50%; 
    transform: translate(-50%,-50%); z-index: 5; 
    display: flex; align-items: center; justify-content: center; font-size: 20px; 
    box-shadow: 0 0 15px rgba(201,162,39,0.5); transition: all 0.3s;
  }
  .wheel-center.pulse { animation: pulse 0.5s infinite alternate; }
  @keyframes pulse { from { box-shadow: 0 0 15px rgba(201,162,39,0.5); } to { box-shadow: 0 0 30px rgba(201,162,39,0.9), 0 0 50px rgba(201,162,39,0.5); } }
  
  .segment { 
    position: absolute; width: 50%; height: 50%; transform-origin: 100% 100%; 
    border: 1px solid rgba(61,47,107,0.3); display: flex; align-items: center; justify-content: center; 
    font-size: 18px; color: #fff; transition: background 0.3s;
  }
  .segment span { transform: rotate(45deg); filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
  .seg-even { background: #1c1338; } .seg-odd { background: #2a1a4a; }
  .segment.winner { background: linear-gradient(135deg, #8a6fe0, #c9a227); box-shadow: inset 0 0 20px rgba(255,255,255,0.5); }

  /* Результат колеса */
  .fortune-result { 
    text-align: center; padding: 20px; 
    background: linear-gradient(180deg, rgba(42,26,74,0.9) 0%, rgba(13,8,32,0.9) 100%); 
    border-radius: 15px; border: 1px solid #c9a227; 
    margin-top: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .fortune-header { 
    color: #f4e2a1; font-size: 20px; margin-bottom: 15px; 
    text-transform: uppercase; letter-spacing: 1px; font-weight: 700;
    text-shadow: 0 0 10px rgba(201,162,39,0.5);
  }
  .fortune-grid { display: flex; flex-direction: column; gap: 12px; text-align: left; }
  .fortune-item { 
    background: rgba(0,0,0,0.3); padding: 12px 15px; border-radius: 10px; 
    border-left: 3px solid #8a6fe0; animation: fadeUp 0.5s ease-out backwards;
  }
  .fortune-item:nth-child(1) { animation-delay: 0.1s; }
  .fortune-item:nth-child(2) { animation-delay: 0.2s; border-color: #4caf50; }
  .fortune-item:nth-child(3) { animation-delay: 0.3s; border-color: #f44336; }
  .fortune-item:nth-child(4) { animation-delay: 0.4s; border-color: #c9a227; background: rgba(201,162,39,0.1); }
  .fortune-item h5 { color: #c9a227; font-size: 11px; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.5px; }
  .fortune-item p { font-size: 14px; line-height: 1.5; color: #e9e4ff; }
  .fortune-item p b { color: #fff; font-size: 15px; }

  /* Гороскоп на месяц */
  .month-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
  .month-card { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); font-size: 12px; line-height: 1.4; }
  .month-card h5 { color: #8a6fe0; font-size: 11px; margin-bottom: 5px; text-transform: uppercase; }
  .month-bars { margin-top: 15px; }
</style>
</head>
<body>
<div class="app">
  <h1>🔮 Мистический гороскоп</h1>
  <p class="tagline">Твой проводник в мир астрологии</p>
  <span class="main-date" id="mainDate"></span>

  <div id="profileSetup" class="setup-birth hidden">
    <h3>Укажи дату рождения</h3>
    <p>Чтобы гороскоп стал по-настоящему твоим</p>
    <input type="date" id="birthInput">
    <button class="btn" onclick="saveBirth()">Сохранить</button>
  </div>

  <div id="profileBar" class="profile-bar hidden">
    <span>Твой знак: <b id="mySignName">-</b></span>
    <button onclick="resetProfile()">Сменить</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="week">Неделя</button>
    <button class="tab" data-tab="month">Месяц</button>
    <button class="tab" data-tab="compat">Совместимость</button>
    <button class="tab" data-tab="dark">Тёмная</button>
    <button class="tab" data-tab="fate">Судьба</button>
    <button class="tab" data-tab="tarot">Таро</button>
    <button class="tab" data-tab="moon">Луна</button>
    <button class="tab" data-tab="fortune">Удача</button>
  </div>

  <!-- НЕДЕЛЯ -->
  <div id="week" class="panel active">
    <div class="sign-grid" id="weekSigns"></div>
    <div id="weekContent"></div>
  </div>

  <!-- МЕСЯЦ -->
  <div id="month" class="panel">
    <div class="sign-grid" id="monthSigns"></div>
    <div id="monthContent"></div>
  </div>

  <!-- СОВМЕСТИМОСТЬ -->
  <div id="compat" class="panel">
    <select id="signA"></select>
    <select id="signB"></select>
    <button class="btn" id="btnCompat">Проверить совместимость</button>
    <div id="compatResult" class="hidden" style="margin-top:20px;">
      <div style="font-size:13px;">❤️ Любовь <div class="bar-track"><div class="bar-fill" id="bLove"></div></div></div>
      <div style="font-size:13px;">🔥 Страсть <div class="bar-track"><div class="bar-fill" id="bPassion"></div></div></div>
      <div style="font-size:13px;">🧠 Понимание <div class="bar-track"><div class="bar-fill" id="bMind"></div></div></div>
      <div style="font-size:13px;">🤝 Дружба <div class="bar-track"><div class="bar-fill" id="bFriend"></div></div></div>
      <div class="info-block" style="margin-top:15px; border-color:#c9a227;">
        <h4>Вердикт астролога</h4>
        <p id="compatText"></p>
      </div>
    </div>
  </div>

  <div id="dark" class="panel">
    <div class="sign-grid" id="darkSigns"></div>
    <div id="darkContent"></div>
  </div>

  <div id="fate" class="panel">
    <div class="sign-grid" id="fateSigns"></div>
    <div id="fateContent"></div>
  </div>

  <!-- ТАРО -->
  <div id="tarot" class="panel" style="text-align:center;">
    <p style="color:#9a8fc0; margin-bottom:15px; font-size:13px;">Твой Старший Аркан по знаку зодиака</p>
    <div class="tarot-card" id="tCard"><span id="tIcon">🌙</span><span id="tName"></span></div>
    <div id="tarotDetails" style="text-align:left;"></div>
  </div>

  <div id="moon" class="panel" style="text-align:center;">
    <div class="moon-icon" id="moonIcon">🌕</div>
    <h3 style="color:#f4e2a1; font-size:20px; margin-bottom:10px;" id="moonPhaseName"></h3>
    <p style="font-size:14px; color:#c9bfe8; line-height: 1.5;" id="moonDesc"></p>
  </div>

  <!-- УДАЧА -->
  <div id="fortune" class="panel">
    <div class="wheel-container">
      <div class="wheel-pointer">▼</div>
      <div class="wheel" id="wheel"><div id="wheelInner" style="width:100%; height:100%; position:relative;"></div></div>
      <div class="wheel-center">✨</div>
    </div>
    <button class="btn btn-gold" id="btnSpin">Крутить колесо</button>
    <div id="fortuneResult" class="fortune-result hidden">
      <div class="fortune-header">Твоя удача:</div>
      <div class="fortune-grid">
        <!-- Заполняется через JS -->
      </div>
    </div>
  </div>
</div>

<script>
/* ========== ДАННЫЕ ========== */
const SIGNS = [
  { id:"aries", name:"Овен", sym:"♈", el:"fire", dates:"21.03–19.04",
    stats:{ energy:92, love:70, money:65, intuition:60 },
    week:{ general:"Неделя потребует решительности и инициативы.",
      days:["Важный разговор. Прямолинейность поможет.","Неожиданная встреча. Не спеши с выводами.","Финансовое планирование. Без импульсивных покупок.","Недопонимание в отношениях. Лучше выслушать.","Энергии больше обычного. Направь её на цели.","Отдохни. Не каждый день должен быть продуктивным.","Планируй будущее. Идея перерастёт в серьёзное."],
      tags:["❤️ Любовь: инициатива","💰 Финансы: осторожно","💼 Карьера: новые проекты","🔢 Число: 9"] },
    dark:"За решительностью прячется страх не успеть. Ты берёшь ответственность на себя, но иногда это превращается в контроль. Тёмная сторона — вспыльчивость. <b>Скрытая сила:</b> умение зажигать других.",
    arcana: { icon:"👑", name:"Император", meaning:"Символ власти, порядка и структуры. Твоя задача — научиться управлять не только другими, но и собой.", advice:"Действуй уверенно, но не забывай о мягкости." }

// Короткие фразы знаков для блока "Послание от"
const SIGN_MESSAGES = {
  aries: "Пора действовать!", taurus: "Цени стабильность.", gemini: "Слушай, что говорят.", cancer: "Чувствуй сердцем.", 
  leo: "Сияй ярче.", virgo: "Все под контролем.", libra: "Ищи баланс.", scorpio: "Ты сильнее, чем думаешь.", 
  sagittarius: "Вперед к мечте!", capricorn: "Шаг за шагом.", aquarius: "Думай иначе.", pisces: "Верь в чудеса."
};

const DAYS_SHORT = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const MONTHS_SHORT = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
const MONTHS_FULL = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];

/* ========== ДАТЫ ========== */
const today = new Date();
const todayIdx = (today.getDay() + 6) % 7;
const monday = new Date(today);
monday.setHours(0,0,0,0);
monday.setDate(today.getDate() - todayIdx);

document.getElementById("mainDate").textContent =
  today.toLocaleDateString("ru-RU", { day:"numeric", month:"long", year:"numeric" });

/* ========== ЛОГИКА ДАТЫ РОЖДЕНИЯ ========== */
function getZodiacSign(dateStr) {
  const d = new Date(dateStr);
  const day = d.getDate();
  const month = d.getMonth() + 1; // 1-12

  if ((month === 3 && day >= 21) || (month === 4 && day <= 19)) return "aries";
  if ((month === 4 && day >= 20) || (month === 5 && day <= 20)) return "taurus";
  if ((month === 5 && day >= 21) || (month === 6 && day <= 20)) return "gemini";
  if ((month === 6 && day >= 21) || (month === 7 && day <= 22)) return "cancer";
  if ((month === 7 && day >= 23) || (month === 8 && day <= 22)) return "leo";
  if ((month === 8 && day >= 23) || (month === 9 && day <= 22)) return "virgo";
  if ((month === 9 && day >= 23) || (month === 10 && day <= 22)) return "libra";
  if ((month === 10 && day >= 23) || (month === 11 && day <= 21)) return "scorpio";
  if ((month === 11 && day >= 22) || (month === 12 && day <= 21)) return "sagittarius";
  if ((month === 12 && day >= 22) || (month === 1 && day <= 19)) return "capricorn";
  if ((month === 1 && day >= 20) || (month === 2 && day <= 18)) return "aquarius";
  return "pisces";
}

let mySignId = localStorage.getItem("mySignId") || null;

function saveBirth() {
  const val = document.getElementById("birthInput").value;
  if (!val) return alert("Выбери дату");
  const sign = getZodiacSign(val);
  localStorage.setItem("mySignId", sign);
  mySignId = sign;
  initProfile();
  renderWeek(mySignId);
}

function resetProfile() {
  localStorage.removeItem("mySignId");
  mySignId = null;
  initProfile();
}

function initProfile() {
  const setup = document.getElementById("profileSetup");
  const bar = document.getElementById("profileBar");
  
  if (mySignId) {
    setup.classList.add("hidden");
    bar.classList.remove("hidden");
    const s = SIGNS.find(x => x.id === mySignId);
    document.getElementById("mySignName").innerText = s.name + " " + s.sym;
  } else {
    setup.classList.remove("hidden");
    bar.classList.add("hidden");
  }
}

/* ========== СОСТОЯНИЕ ========== */
let curSign = mySignId || "aries";
let curMonthSign = mySignId || "aries";
let curDay = todayIdx;
let isSpin = false;
let rot = 0;

/* ========== ВКЛАДКИ ========== */
document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    const id = btn.dataset.tab;
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(id).classList.add("active");
    if (id === "tarot") renderTarot();
    if (id === "moon") renderMoon();
    if (id === "month") renderMonth(curMonthSign);
  });
});

/* ========== КНОПКИ ЗНАКОВ ========== */
function buildSignButtons(containerId, renderFn) {
  const box = document.getElementById(containerId);
  box.innerHTML = "";
  SIGNS.forEach(s => {
    const b = document.createElement("button");
    b.className = "sign-btn el-" + s.el;
    b.dataset.sign = s.id;
    b.innerHTML = s.sym + "<br>" + s.name;
    b.addEventListener("click", () => renderFn(s.id));
    box.appendChild(b);
  });
}

function setActiveSign(containerId, id) {
  document.querySelectorAll("#" + containerId + " .sign-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.sign === id);
  });
}

/* ========== НЕДЕЛЯ ========== */
function renderWeek(id) {
  curSign = id;
  const s = SIGNS.find(x => x.id === id);
  setActiveSign("weekSigns", id);

  let nav = '<div class="days-nav">';
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    nav += `<button class="day-btn ${i === todayIdx ? "today" : ""} ${i === curDay ? "active" : ""}" data-day="${i}">
      ${DAYS_SHORT[i]}
      <span class="date-num">${d.getDate()}</span>
      <span class="date-mon">${MONTHS_SHORT[d.getMonth()]}</span>
    </button>`;
  }
  nav += "</div>";

  const st = s.stats;
  const power = Math.round((st.energy + st.love + st.money + st.intuition) / 4);
  const R = 50;
  const CIRC = 2 * Math.PI * R;
  const offset = CIRC - (power / 100) * CIRC;

  const statRow = (label, val) => `
    <div class="stat-row">
      <div class="stat-head"><span>${label}</span><b>${val}%</b></div>
      <div class="stat-track"><div class="stat-fill" data-w="${val}"></div></div>
    </div>`;

  const tagsHtml = s.week.tags.map(t => `<div class="meta-tag">${t}</div>`).join("");

  document.getElementById("weekContent").innerHTML = `
    <div class="week-title"><div>${s.sym} ${s.name}</div><span>${s.dates}</span></div>
    <p style="margin-bottom:12px;font-size:13px;line-height:1.5;color:#c9bfe8;">${s.week.general}</p>
    ${nav}
    <div class="day-content">
      <div class="zodiac-watermark">${s.sym}</div>
      ${curDay === todayIdx ? '<div class="today-badge">Сегодня</div>' : ""}
      <div>${s.week.days[curDay]}</div>
    </div>
    <div class="infographic">
      <div class="ring-wrap">
        <svg width="130" height="130" viewBox="0 0 130 130">
          <circle class="ring-bg" cx="65" cy="65" r="${R}" fill="none" stroke-width="8"/>
          <circle class="ring-fg" cx="65" cy="65" r="${R}" fill="none" stroke-width="8"
            stroke-dasharray="${CIRC.toFixed(1)}"
            stroke-dashoffset="${CIRC.toFixed(1)}"
            data-offset="${offset.toFixed(1)}"/>
        </svg>
        <div class="ring-label"><b>${power}%</b><small>сила</small></div>
      </div>
      <div class="stats">
        ${statRow("⚡ Энергия", st.energy)}
        ${statRow("❤️ Любовь", st.love)}
        ${statRow("💰 Финансы", st.money)}
        ${statRow("🔮 Интуиция", st.intuition)}
      </div>
    </div>
    <button class="share-btn" id="btnShare">Поделиться</button>
    <div class="meta-tags">${tagsHtml}</div>
  `;

  document.querySelectorAll("#weekContent .day-btn").forEach(b => {
    b.addEventListener("click", () => {
      curDay = +b.dataset.day;
      renderWeek(curSign);
    });
  });
  document.getElementById("btnShare").addEventListener("click", shareGoroscope);

  requestAnimationFrame(() => {
    document.querySelectorAll("#weekContent .stat-fill").forEach(el => {
      el.style.width = el.dataset.w + "%";
    });
    const ring = document.querySelector("#weekContent .ring-fg");
    if (ring) ring.style.strokeDashoffset = ring.dataset.offset;
  });
}

function shareGoroscope() {
  const s = SIGNS.find(x => x.id === curSign);
  const text = `Мой гороскоп на сегодня: ${s.week.days[curDay]}`;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => alert("Скопировано в буфер!")).catch(() => alert(text));
  } else {
    alert(text);
  }
}

/* ========== МЕСЯЦ ========== */
function renderMonth(id) {
  curMonthSign = id;
  const s = SIGNS.find(x => x.id === id);
  setActiveSign("monthSigns", id);

  const now = new Date();
  const mName = MONTHS_FULL[now.getMonth()];
  
  // Детерминированная генерация на основе текущего месяца и знака
  const seed = now.getFullYear() * 100 + now.getMonth() + id.length;
  const theme = MONTH_THEMES[seed % MONTH_THEMES.length];
  
  const w1 = 50 + (seed * 7) % 50;
  const w2 = 50 + (seed * 13) % 50;
  const w3 = 50 + (seed * 19) % 50;
  const w4 = 50 + (seed * 23) % 50;

  document.getElementById("monthContent").innerHTML = `
    <div class="week-title"><div>${s.sym} ${s.name}</div><span>${mName} ${now.getFullYear()}</span></div>
    <p style="margin-bottom:15px;font-size:14px;line-height:1.6;color:#f4e2a1;font-style:italic;">"${theme}"</p>
    
    <div class="month-grid">
      <div class="month-card">
        <h5>1-я неделя</h5>
        <p>${s.week.days[0]}</p>
      </div>
      <div class="month-card">
        <h5>2-я неделя</h5>
        <p>${s.week.days[2]}</p>
      </div>
      <div class="month-card">
        <h5>3-я неделя</h5>
        <p>${s.week.days[4]}</p>
      </div>
      <div class="month-card">
        <h5>4-я неделя</h5>
        <p>${s.week.days[6]}</p>
      </div>
    </div>

    <div class="month-bars" style="margin-top:20px;">
      <div style="font-size:12px; margin-bottom:5px; color:#c9bfe8;">Прогноз активности по неделям:</div>
      <div class="stat-track" style="height:8px; margin-bottom:12px;"><div class="stat-fill" style="width:${w1}%"></div></div>
      <div class="stat-track" style="height:8px; margin-bottom:12px;"><div class="stat-fill" style="width:${w2}%"></div></div>
      <div class="stat-track" style="height:8px; margin-bottom:12px;"><div class="stat-fill" style="width:${w3}%"></div></div>
      <div class="stat-track" style="height:8px; margin-bottom:12px;"><div class="stat-fill" style="width:${w4}%"></div></div>
    </div>
  `;
}

/* ========== ТЁМНАЯ ========== */
function renderDark(id) {
  const s = SIGNS.find(x => x.id === id);
  setActiveSign("darkSigns", id);
  document.getElementById("darkContent").innerHTML = `
    <div class="week-title"><div>${s.sym} ${s.name}</div></div>
    <div class="info-block" style="border-color:#e07fb0;"><p>${s.dark}</p></div>
  `;
}

/* ========== СУДЬБА ========== */
function renderFate(id) {
  const s = SIGNS.find(x => x.id === id);
  setActiveSign("fateSigns", id);
  const f = FATE[s.name];
  document.getElementById("fateContent").innerHTML = `
    <div class="week-title"><div>${s.sym} ${s.name}</div></div>
    <div class="info-block"><h4>Главная тема</h4><p><b>${f.theme[0]}:</b> ${f.theme[1]}</p></div>
    <div class="info-block"><h4>Сильная сторона</h4><p><b>${f.strong[0]}:</b> ${f.strong[1]}</p></div>
    <div class="info-block"><h4>Главный урок</h4><p><b>${f.lesson[0]}:</b> ${f.lesson[1]}</p></div>
  `;
}

/* ========== СОВМЕСТИМОСТЬ ========== */
const NAMES = SIGNS.map(s => s.name);
const selA = document.getElementById("signA");
const selB = document.getElementById("signB");
NAMES.forEach(n => {
  selA.add(new Option(n, n));
  selB.add(new Option(n, n));
});
selB.selectedIndex = 1;

document.getElementById("btnCompat").addEventListener("click", calcCompat);

function calcCompat() {
  const a = selA.value;
  const b = selB.value;
  let type = "n";
  if (COMPAT[a] && COMPAT[a][b]) type = COMPAT[a][b];
  else if (COMPAT[b] && COMPAT[b][a]) type = COMPAT[b][a];

  const base = type === "h" ? [88, 92, 80, 85]
             : type === "x" ? [45, 65, 40, 45]
             : [65, 60, 65, 70];
  const text = type === "h"
    ? "Сильное притяжение. Вы способны дополнять друг друга, но иногда взгляды различаются. Секрет гармонии — принимать особенности, не пытаясь переделать."
    : type === "x"
    ? "Непростой союз: взгляды часто расходятся. Но именно через различия вы способны сильно вырасти. Главное — не пытаться переделать партнёра."
    : "Спокойное, ровное сочетание. Ярких вспышек нет, но есть устойчивость. Всё зависит от готовности вкладываться и идти на компромиссы.";

  document.getElementById("bLove").style.width = base[0] + "%";
  document.getElementById("bPassion").style.width = base[1] + "%";
  document.getElementById("bMind").style.width = base[2] + "%";
  document.getElementById("bFriend").style.width = base[3] + "%";
  document.getElementById("compatText").textContent = text;
  document.getElementById("compatResult").classList.remove("hidden");
}

/* ========== ТАРО (СТАРШИЙ АРКАН ЗНАКА) ========== */
function renderTarot() {
  const targetSign = mySignId || curSign;
  const s = SIGNS.find(x => x.id === targetSign);
  
  document.getElementById("tIcon").textContent = s.arcana.icon;
  document.getElementById("tName").textContent = s.arcana.name;
  
  document.getElementById("tarotDetails").innerHTML = `
    <div class="info-block"><h4>Значение для ${s.name}</h4><p>${s.arcana.meaning}</p></div>
    <div class="info-block" style="border-color:#4caf50;"><h4>✨ Твой совет</h4><p>${s.arcana.advice}</p></div>
  `;
}

/* ========== ЛУНА ========== */
function renderMoon() {
  const days = (new Date() - new Date("2024-01-11")) / 86400000;
  const idx = Math.floor(((days % 29.53) / 29.53) * 8) % 8;
  const ph = MOON[idx];
  document.getElementById("moonIcon").textContent = ph.icon;
  document.getElementById("moonPhaseName").textContent = ph.n;
  document.getElementById("moonDesc").textContent = ph.d;
}

/* ========== КОЛЕСО УДАЧИ ========== */
function buildWheel() {
  const inner = document.getElementById("wheelInner");
  inner.innerHTML = "";
  SIGNS.forEach((s, i) => {
    const seg = document.createElement("div");
    seg.className = "segment " + (i % 2 === 0 ? "seg-even" : "seg-odd");
    seg.style.transform = `rotate(${i * 30}deg)`;
    seg.dataset.index = i;
    seg.innerHTML = `<span>${s.sym}</span>`;
    inner.appendChild(seg);
  });
}
buildWheel();

document.getElementById("btnSpin").addEventListener("click", spinWheel);

function spinWheel() {
  if (isSpin) return;
  isSpin = true;
  
  // Сброс предыдущего результата
  const resBox = document.getElementById("fortuneResult");
  resBox.classList.add("hidden");
  document.querySelectorAll("#wheelInner .segment").forEach(s => s.classList.remove("winner"));
  
  // Анимация
  const wheelEl = document.getElementById("wheel");
  wheelEl.classList.add("spinning");
  document.querySelector(".wheel-center").classList.add("pulse");
  document.getElementById("btnSpin").innerText = "Колесо судьбы крутится...";

  // Выбираем случайный сектор (0-11)
  const idx = Math.floor(Math.random() * 12);
  // Сектор 0 находится справа, идем против часовой стрелки, чтобы выровнять по указателю сверху
  const targetAngle = 360 * 6 + (360 - idx * 30);
  rot += targetAngle;
  wheelEl.style.transform = `rotate(${rot}deg)`;

  setTimeout(() => {
    isSpin = false;
    wheelEl.classList.remove("spinning");
    document.querySelector(".wheel-center").classList.remove("pulse");
    document.getElementById("btnSpin").innerText = "Крутить еще раз";

    // Подсветка выигрышного сектора
    document.querySelector(`#wheelInner .segment[data-index="${idx}"]`).classList.add("winner");

    const s = SIGNS[idx];
    const f = FORTUNE_SECTORS[idx]; // Берем сферу по индексу
    const msg = SIGN_MESSAGES[s.id] || "Слушай вселенную.";

    resBox.innerHTML = `
      <div class="fortune-header">Твоя удача:</div>
      <div class="fortune-grid">
        <div class="fortune-item">
          <h5>Сектор</h5>
          <p><b>${f.icon} ${f.name}</b> — под покровительством знака <b>${s.name} ${s.sym}</b></p>
          <p style="font-size:12px;color:#9a8fc0;margin-top:4px;">${msg}</p>
        </div>
        <div class="fortune-item">
          <h5>✨ Совет дня</h5>
          <p>${f.advice}</p>
        </div>
        <div class="fortune-item">
          <h5>⚠️ Остерегайся</h5>
          <p>${f.avoid}</p>
        </div>
        <div class="fortune-item">
          <h5>🌟 Аффирмация</h5>
          <p style="font-style:italic;">«${f.affirm}»</p>
        </div>
      </div>
    `;
    resBox.classList.remove("hidden");
  }, 6000); // Ждем, пока остановится (6 секунд CSS transition)
}

/* ========== ИНИЦИАЛИЗАЦИЯ ========== */
buildSignButtons("weekSigns", renderWeek);
buildSignButtons("monthSigns", renderMonth);
buildSignButtons("darkSigns", renderDark);
buildSignButtons("fateSigns", renderFate);

initProfile();
renderWeek(curSign);
renderMonth(curMonthSign);
renderDark(mySignId || "aries");
renderFate(mySignId || "aries");
</script>
