<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мистический гороскоп</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #0d0820; color: #e9e4ff; padding: 20px 10px; min-height: 100vh; }
  .app { max-width: 600px; margin: 0 auto; }
  h1 { font-size: 24px; text-align: center; color: #f4e2a1; margin-bottom: 5px; }
  .tagline { text-align: center; color: #9a8fc0; font-size: 13px; margin-bottom: 15px; }
  .current-date { text-align: center; font-size: 12px; color: #c9a227; margin-bottom: 20px; text-transform: uppercase; background: #1a1233; display: inline-block; padding: 4px 12px; border-radius: 15px; left: 50%; position: relative; transform: translateX(-50%); }
  
  .tabs { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
  .tab { padding: 8px 12px; border-radius: 15px; border: 1px solid #4a3a7a; background: transparent; color: #c9bfe8; cursor: pointer; font-size: 12px; }
  .tab.active { background: #6a4fc0; color: #fff; border-color: #c9a227; }
  
  .panel { display: none; background: #1a1233; padding: 20px 15px; border-radius: 15px; border: 1px solid #3d2f6b; }
  .panel.active { display: block; }
  
  .sign-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 15px; }
  .sign-btn { padding: 10px 2px; border-radius: 8px; border: 1px solid #3d2f6b; background: #0d0820; color: #d9d0f5; cursor: pointer; text-align: center; font-size: 11px; position: relative; }
  .sign-btn.active { border-color: #c9a227; background: #2a1a4a; color: #fff; }
  
  .el-fire { border-bottom: 2px solid #ff5722; } .el-water { border-bottom: 2px solid #2196f3; } .el-earth { border-bottom: 2px solid #4caf50; } .el-air { border-bottom: 2px solid #ffeb3b; }

  .week-title { font-size: 18px; color: #f4e2a1; margin-bottom: 10px; border-bottom: 1px solid #3d2f6b; padding-bottom: 8px; display: flex; justify-content: space-between; }
  .week-title span { font-size: 11px; color: #9a8fc0; }
  
  .days-nav { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
  .day-btn { flex: 1; min-width: 45px; padding: 8px 3px; border-radius: 8px; border: 1px solid #3d2f6b; background: #0d0820; color: #9a8fc0; font-size: 10px; cursor: pointer; text-align: center; }
  .day-btn.today { border-color: #c9a227; color: #c9a227; }
  .day-btn.active { background: #6a4fc0; color: #fff; border-color: #c9a227; }
  .day-btn .date-num { display: block; font-size: 15px; font-weight: bold; }
  
  .day-content { padding: 15px; border-left: 3px solid #c9a227; background: #2a1a4a; border-radius: 0 8px 8px 0; font-size: 13px; line-height: 1.5; margin-bottom: 12px; position: relative; }
  .today-badge { display: inline-block; background: #c9a227; color: #0d0820; padding: 2px 6px; border-radius: 5px; font-size: 10px; margin-bottom: 5px; font-weight: bold; }
  
  .meta-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .meta-tag { background: #0d0820; padding: 6px 10px; border-radius: 6px; font-size: 11px; border: 1px solid #3d2f6b; }
  .zodiac-watermark { position: absolute; bottom: 0; right: 5px; font-size: 60px; opacity: 0.1; }
  
  select { width: 100%; padding: 10px; margin-bottom: 8px; background: #0d0820; color: #fff; border: 1px solid #4a3a7a; border-radius: 8px; font-size: 14px; }
  .btn { padding: 12px; width: 100%; background: #6a4fc0; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; margin-top: 8px; }
  .btn-gold { background: #c9a227; color: #0d0820; }
  
  .bar-track { height: 6px; background: #0d0820; border-radius: 3px; margin: 3px 0 10px; overflow: hidden; }
  .bar-fill { height: 100%; background: #c9a227; width: 0; transition: width 1s; }
  .hidden { display: none; }
  .info-block { background: #0d0820; padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 2px solid #8a6fe0; }
  .info-block h4 { color: #c9a227; font-size: 12px; margin-bottom: 4px; }
  .info-block p { font-size: 13px; line-height: 1.4; }
  
  .tarot-card { width: 120px; height: 180px; margin: 0 auto 15px; border: 2px solid #c9a227; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 40px; background: #1c1338; }
  .tarot-card span { font-size: 14px; color: #fff; margin-top: 10px; }
  .moon-icon { font-size: 60px; text-align: center; margin: 15px 0; }
  .share-btn { background: transparent; border: 1px solid #4a3a7a; color: #c9bfe8; padding: 6px 12px; border-radius: 15px; cursor: pointer; font-size: 12px; margin-top: 8px; }
  
  .wheel-container { position: relative; width: 200px; height: 200px; margin: 20px auto 30px; }
  .wheel-pointer { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); font-size: 24px; z-index: 10; color: #c9a227; }
  .wheel { width: 100%; height: 100%; border-radius: 50%; border: 3px solid #c9a227; position: relative; overflow: hidden; transition: transform 5s ease-out; }
  .wheel-center { position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; background: #0d0820; border: 2px solid #c9a227; border-radius: 50%; transform: translate(-50%, -50%); z-index: 5; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .segment { position: absolute; width: 50%; height: 50%; transform-origin: 100% 100%; border: 1px solid #3d2f6b; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; }
  .segment span { transform: rotate(45deg); }
  .seg-0, .seg-2, .seg-4, .seg-6, .seg-8, .seg-10 { background: #1c1338; }
  .seg-1, .seg-3, .seg-5, .seg-7, .seg-9, .seg-11 { background: #2a1a4a; }
  .fortune-result { text-align: center; padding: 15px; background: #2a1a4a; border-radius: 10px; border: 1px dashed #c9a227; margin-top: 15px; }
</style>
</head>
<body>
<div class="app">
  <h1>🔮 Мистический гороскоп</h1>
  <p class="tagline">Твой проводник в мир астрологии</p>
  <div class="current-date" id="mainDate"></div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('week', this)">Неделя</button>
    <button class="tab" onclick="showTab('compat', this)">Совместимость</button>
    <button class="tab" onclick="showTab('dark', this)">Тёмная</button>
    <button class="tab" onclick="showTab('fate', this)">Судьба</button>
    <button class="tab" onclick="showTab('tarot', this)">Таро</button>
    <button class="tab" onclick="showTab('moon', this)">Луна</button>
    <button class="tab" onclick="showTab('fortune', this)">Удача</button>
  </div>

  <div id="week" class="panel active">
    <div class="sign-grid" id="weekSigns"></div>
    <div id="weekContent"></div>
  </div>

  <div id="compat" class="panel">
    <select id="signA"></select>
    <select id="signB"></select>
    <button class="btn" onclick="calcCompat()">Проверить</button>
    <div id="compatResult" class="hidden" style="margin-top:15px;">
      <div style="font-size:12px;">❤️ Любовь <div class="bar-track"><div class="bar-fill" id="bLove"></div></div></div>
      <div style="font-size:12px;">🔥 Страсть <div class="bar-track"><div class="bar-fill" id="bPassion"></div></div></div>
      <div style="font-size:12px;">🧠 Понимание <div class="bar-track"><div class="bar-fill" id="bMind"></div></div></div>
      <div style="font-size:12px;">🤝 Дружба <div class="bar-track"><div class="bar-fill" id="bFriend"></div></div></div>
      <div class="info-block" style="margin-top:10px;"><h4>Вердикт</h4><p id="compatText"></p></div>
    </div>
  </div>

  <div id="dark" class="panel">
    <div class="sign-grid" id="darkSigns"></div>
    <div id="darkContent"></div>
  </div>

  <div id="fate" class="panel">
    <div class="sign-grid" id="fateSigns"></div>
    <div id="fateContent"></div>
  </div>

  <div id="tarot" class="panel" style="text-align:center;">
    <div class="tarot-card" id="tCard"><span id="tIcon">🌙</span><span id="tName"></span></div>
    <div id="tarotDetails" style="text-align:left;"></div>
  </div>
  
  <div id="moon" class="panel" style="text-align:center;">
    <div class="moon-icon" id="moonIcon">🌕</div>
    <h3 style="color:#f4e2a1; font-size:18px; margin-bottom:8px;" id="moonPhaseName"></h3>
    <p style="font-size:13px;" id="moonDesc"></p>
  </div>
  
  <div id="fortune" class="panel">
    <div class="wheel-container">
      <div class="wheel-pointer">▼</div>
      <div class="wheel" id="wheel"><div id="wheelInner" style="width:100%; height:100%; position:relative;"></div></div>
      <div class="wheel-center">✨</div>
    </div>
    <button class="btn btn-gold" onclick="spinWheel()">Крутить</button>
    <div id="fortuneResult" class="fortune-result hidden">
      <h3 id="fSign" style="color:#f4e2a1; font-size:16px; margin-bottom:5px;"></h3>
      <p id="fText" style="font-size:13px;"></p>
    </div>
  </div>
</div>

<script>
const SIGNS = [
  { id:"aries", name:"Овен", sym:"♈", el:"fire", dates:"21.03-19.04", week:{ general:"Потребует решительности.", days:["Разговор.","Встреча.","Финансы.","Отношения.","Энергия.","Отдых.","Планы."], tags:["❤️ Любовь","💰 Финансы","💼 Карьера","🍀 Число 9"] }, dark:"Страх не успеть. Вспыльчивость." },
  { id:"taurus", name:"Телец", sym:"♉", el:"earth", dates:"20.04-20.05", week:{ general:"Желание стабильности.", days:["Наблюдай.","Сюрприз.","Работа.","Романтика.","Самооценка.","Финансы.","Близкие."], tags:["❤️ Любовь","💰 Финансы","💼 Карьера","🍀 Число 6"] }, dark:"Страх перемен. Упрямство." },
  { id:"gemini", name:"Близнецы", sym:"♊", el:"air", dates:"21.05-20.06", week:{ general:"Насыщенная неделя.", days:["Сообщение.","Знакомства.","Планы.","Прошлое.","Эмоции.","Творчество.","Выбор."], tags:["❤️ Любовь","💰 Финансы","💼 Карьера","🍀 Число 5"] }, dark:"Страх привязанности. Непостоянство." },
  { id:"cancer", name:"Рак", sym:"♋", el:"water", dates:"21.06-22.07", week:{ general:"Задумайся о себе.", days:["Ощущения.","Поддержка.","Обиды.","Отношения.","Раздражительность.","Спокойствие.","Осознание."], tags:["❤️ Любовь","💰 Финансы","💼 Карьера","🍀 Число 2"] }, dark:"Страх отвержения. Обидчивость." },
  { id:"leo", name:"Лев", sym:"♌", el:"fire", dates:"23.07-22.08", week:{ general:"В центре внимания.", days:["Желания.","Начинания.","Похвала.","Гордость.","Встречи.","Соперничество.","Цели."], tags:["❤️ Любовь","💰 Финансы","💼 Карьера","🍀 Число 1"] }, dark:"Страх быть незамеченным. Гордость." },
  { id:"virgo", name:"Дева", sym:"♍", el:"earth", dates:"23.08-22.09", week:{ general:"Наведи порядок.", days:["Дела.","Критика.","Работа.","Комплимент.","Проблемы.","Здоровье.","Ошибка."], tags:["❤️ Любовь","💰 Финансы","💼 Карьера","🍀 Число 4"] }, dark:"Страх несовершенства. Занудство." },
  { id:"libra", name:"Весы", sym:"♎", el:"air", dates:"23.09-22.10", week:{ general:"Время выбора.", days:["Угождение.","Романтика.","Договор.","Сомнения.","Встреча.","Конфликты.","Решения."], tags:["❤️ Любовь","💰 Финансы","💼 Карьера","🍀 Число 7"] }, dark:"Страх конфликтов. Нерешительность." },
  { id:"scorpio", name:"Скорпион", sym:"♏", el:"water", dates:"23.10-21.11", week:{ general:"Разберись в чувствах.", days:["Детали.","Разговор.","Ревность.","Поворот.","Привычки.","Идея.","Опыт."], tags:["❤️ Любовь","💰 Финансы","💼 Карьера","🍀 Число 8"] }, dark:"Страх предательства. Манипуляции." },
  { id:"sagittarius", name:"Стрелец", sym:"♐", el:"fire", dates:"22.11-21.12", week:{ general:"Новые возможности.", days:["Шанс.","Путешествия.","Обещания.","Встреча.","Новое.","Финансы.","Итоги."], tags:["❤️ Любовь","💰 Финансы","💼 Карьера","🍀 Число 3"] }, dark:"Страх обязательств. Инфантильность." },
  { id:"capricorn", name:"Козерог", sym:"♑", el:"earth", dates:"22.12-19.01", week:{ general:"Конкретные результаты.", days:["Цель.","Помощь.","Работа.","Близкие.","Сравнение.","Праздник.","Привычки."], tags:["❤️ Любовь","💰 Финансы","💼 Карьера","🍀 Число 10"] }, dark:"Страх слабости. Жесткость." },
  { id:"aquarius", name:"Водолей", sym:"♒", el:"air", dates:"20.01-18.02", week:{ general:"Нестандартность.", days:["Идея.","Друзья.","Критика.","Новость.","Эксперимент.","Открытость.","Планы."], tags:["❤️ Любовь","💰 Финансы","💼 Карьера","🍀 Число 11"] }, dark:"Страх привязанности. Холодность." },
  { id:"pisces", name:"Рыбы", sym:"♓", el:"water", dates:"19.02-20.03", week:{ general:"Самоанализ.", days:["Голос.","Творчество.","Ответственность.","Романтика.","Прошлое.","Хобби.","Размышления."], tags:["❤️ Любовь","💰 Финансы","💼 Карьера","🍀 Число 12"] }, dark:"Страх реальности. Иллюзии." }
];

const FATE = {
  "Овен": ["Лидерство","Смелость","Терпение"], "Телец": ["Стабильность","Надёжность","Гибкость"],
  "Близнецы": ["Общение","Интеллект","Постоянство"], "Рак": ["Семья","Забота","Границы"],
  "Лев": ["Признание","Уверенность","Скромность"], "Дева": ["Порядок","Аналитика","Принятие"],
  "Весы": ["Гармония","Дипломатия","Самостоятельность"], "Скорпион": ["Трансформация","Решительность","Доверие"],
  "Стрелец": ["Свобода","Оптимизм","Ответственность"], "Козерог": ["Достижения","Дисциплина","Баланс"],
  "Водолей": ["Новаторство","Оригинальность","Близость"], "Рыбы": ["Творчество","Эмпатия","Реализм"]
};

const COMPAT = { "Овен": { "Лев":"h", "Стрелец":"h", "Близнецы":"h", "Рак":"x", "Козерог":"x" }, "Телец": { "Дева":"h", "Козерог":"h", "Рак":"h", "Лев":"x", "Водолей":"x" }, "Близнецы": { "Весы":"h", "Водолей":"h", "Овен":"h", "Дева":"x", "Рыбы":"x" }, "Рак": { "Рыбы":"h", "Скорпион":"h", "Телец":"h", "Овен":"x", "Весы":"x" }, "Лев": { "Овен":"h", "Стрелец":"h", "Весы":"h", "Телец":"x", "Скорпион":"x" }, "Дева": { "Телец":"h", "Козерог":"h", "Скорпион":"h", "Близнецы":"x", "Стрелец":"x" }, "Весы": { "Близнецы":"h", "Водолей":"h", "Лев":"h", "Рак":"x", "Козерог":"x" }, "Скорпион": { "Рак":"h", "Рыбы":"h", "Дева":"h", "Лев":"x", "Водолей":"x" }, "Стрелец": { "Овен":"h", "Лев":"h", "Водолей":"h", "Дева":"x", "Рыбы":"x" }, "Козерог": { "Телец":"h", "Дева":"h", "Рыбы":"h", "Овен":"x", "Весы":"x" }, "Водолей": { "Близнецы":"h", "Весы":"h", "Стрелец":"h", "Телец":"x", "Скорпион":"x" }, "Рыбы": { "Рак":"h", "Скорпион":"h", "Козерог":"h", "Близнецы":"x", "Стрелец":"x" } };

const TAROT = [ { icon:"🌞", name:"Солнце", m:"Успех.", a:"Делись теплом.", v:"Не хвастайся." }, { icon:"🌙", name:"Луна", m:"Иллюзии.", a:"Интуиция.", v:"Не решай в тумане." }, { icon:"⭐", name:"Звезда", m:"Надежда.", a:"Шаг к мечте.", v:"Не падай духом." }, { icon:"⚔️", name:"Справедливость", m:"Истина.", a:"Честность.", v:"Не хитри." }, { icon:"🛞", name:"Колесо Фортуны", m:"Перемены.", a:"Лови знаки.", v:"Не цепляйся." } ];

const MOON = [ { icon:"🌑", n:"Новолуние", d:"Планирование." }, { icon:"🌒", n:"Растущая", d:"Начинания." }, { icon:"🌓", n:"Первая четверть", d:"Препятствия." }, { icon:"🌔", n:"Прибывающая", d:"Пик энергии." }, { icon:"🌕", n:"Полнолуние", d:"Пик эмоций." }, { icon:"🌖", n:"Убывающая", d:"Порядок." }, { icon:"🌗", n:"Последняя четверть", d:"Завершение." }, { icon:"🌘", n:"Убывающая", d:"Отдых." } ];

const NAMES = SIGNS.map(s => s.name);
const DAYS = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
const today = new Date();
const todayIdx = (today.getDay() + 6) % 7;
const monday = new Date(today);
monday.setDate(today.getDate() - todayIdx);

let curSign = "aries", curDay = todayIdx, isSpin = false, rot = 0;
document.getElementById("mainDate").innerText = today.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });

const wInner = document.getElementById("wheelInner");
SIGNS.forEach((s, i) => { wInner.innerHTML += `<div class="segment seg-${i}" style="transform:rotate(${i*30}deg)"><span>${s.sym}</span></div>`; });

function showTab(id, btn) {
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  btn.classList.add("active");
  if (id === "tarot") renderTarot();
  if (id === "moon") renderMoon();
}

function makeBtns(cont, fn) {
  document.getElementById(cont).innerHTML = SIGNS.map(s => `<button class="sign-btn el-${s.el}" onclick="(${fn.name})('${s.id}')">${s.sym}<br>${s.name}</button>`).join("");
}

function setDay(i) { curDay = i; renderWeek(curSign); }

function renderWeek(id) {
  curSign = id;
  const s = SIGNS.find(x => x.id === id);
  document.querySelectorAll("#weekSigns .sign-btn").forEach((b,i) => b.classList.toggle("active", SIGNS[i].id === id));
  let nav = '<div class="days-nav">';
  for(let i=0; i<7; i++) {
    let d = new Date(monday); d.setDate(monday.getDate() + i);
    nav += `<button class="day-btn ${i===todayIdx?'today':''} ${i===curDay?'active':''}" onclick="setDay(${i})">${DAYS[i]}<span class="date-num">${d.getDate()}</span></button>`;
  }
  nav += '</div>';
  document.getElementById("weekContent").innerHTML = `
    <div class="week-title"><div>${s.sym} ${s.name}</div><span>${s.dates}</span></div>
    <p style="margin-bottom:10px;font-size:12px;">${s.week.general}</p>
    ${nav}
    <div class="day-content">
      <div class="zodiac-watermark">${s.sym}</div>
      ${curDay===todayIdx ? '<div class="today-badge">✨ Сегодня</div>' : ''}
      <div>${s.week.days[curDay]}</div>
    </div>
    <button class="share-btn" onclick="share()">📤 Поделиться</button>
    <div class="meta-tags">${s.tags.map(t=>`<div class="meta-tag">${t}</div>`).join("")}</div>
  `;
}

function share() {
  const s = SIGNS.find(x => x.id === curSign);
  navigator.clipboard.writeText(`Мой гороскоп: ${s.week.days[curDay]}`).then(()=>alert("Скопировано!"));
}

function renderDark(id) {
  const s = SIGNS.find(x => x.id === id);
  document.querySelectorAll("#darkSigns .sign-btn").forEach((b,i) => b.classList.toggle("active", SIGNS[i].id === id));
  document.getElementById("darkContent").innerHTML = `<div class="week-title"><div>${s.sym} ${s.name}</div></div><div class="info-block"><p>${s.dark}</p></div>`;
}

function renderFate(id) {
  const s = SIGNS.find(x => x.id === id);
  document.querySelectorAll("#fateSigns .sign-btn").forEach((b,i) => b.classList.toggle("active", SIGNS[i].id === id));
  const f = FATE[s.name];
  document.getElementById("fateContent").innerHTML = `
    <div class="week-title"><div>${s.sym} ${s.name}</div></div>
    <div class="info-block"><h4>Тема</h4><p>${f[0]}</p></div>
    <div class="info-block"><h4>Сила</h4><p>${f[1]}</p></div>
    <div class="info-block"><h4>Урок</h4><p>${f[2]}</p></div>
  `;
}

makeBtns("weekSigns", renderWeek); renderWeek(curSign);
makeBtns("darkSigns", renderDark); renderDark("aries");
makeBtns("fateSigns", renderFate); renderFate("aries");

document.getElementById("signA").innerHTML = NAMES.map(n => `<option>${n}</option>`).join("");
document.getElementById("signB").innerHTML = NAMES.map(n => `<option>${n}</option>`).join("");
document.getElementById("signB").selectedIndex = 1;

function calcCompat() {
  const a = document.getElementById("signA").value, b = document.getElementById("signB").value;
  let type = "n";
  if (COMPAT[a] && COMPAT[a][b]) type = COMPAT[a][b];
  else if (COMPAT[b] && COMPAT[b][a]) type = COMPAT[b][a];
  let base = type==="h" ? [88, 92, 80, 85] : type==="x" ? [45, 65, 40, 45] : [65, 60, 65, 70];
  let txt = type==="h" ? "Сильное притяжение." : type==="x" ? "Непростой союз." : "Спокойный союз.";
  ["bLove","bPassion","bMind","bFriend"].forEach((id,i) => document.getElementById(id).style.width = base[i] + "%");
  document.getElementById("compatText").innerText = txt;
  document.getElementById("compatResult").classList.remove("hidden");
}

function renderTarot() {
  const t = TAROT[Math.floor(Math.random() * TAROT.length)];
  document.getElementById("tIcon").innerText = t.icon;
  document.getElementById("tName").innerText = t.name;
  document.getElementById("tarotDetails").innerHTML = `<div class="info-block"><h4>🌟</h4><p>${t.m}</p></div><div class="info-block"><h4>✨</h4><p>${t.a}</p></div><div class="info-block"><h4>⚠️</h4><p>${t.v}</p></div>`;
}

function renderMoon() {
  const days = (new Date() - new Date('2024-01-11')) / 86400000;
  const ph = MOON[Math.floor(((days % 29.53) / 29.53) * 8) % 8];
  document.getElementById("moonIcon").innerText = ph.icon;
  document.getElementById("moonPhaseName").innerText = ph.n;
  document.getElementById("moonDesc").innerText = ph.d;
}

function spinWheel() {
  if (isSpin) return; isSpin = true;
  document.getElementById("fortuneResult").classList.add("hidden");
  const idx = Math.floor(Math.random() * 12);
  rot += 1800 + (360 - (idx * 30) - (rot % 360));
  document.getElementById("wheel").style.transform = `rotate(${rot}deg)`;
  setTimeout(() => {
    isSpin = false;
    document.getElementById("fSign").innerText = `Послание от ${SIGNS[idx].name} ${SIGNS[idx].sym}`;
    document.getElementById("fText").innerText = `"${SIGNS[idx].week.days[Math.floor(Math.random() * 7)]}"`;
    document.getElementById("fortuneResult").classList.remove("hidden");
  }, 5100);
}
</script>
