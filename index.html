<style>

* { box-sizing: border-box; margin: 0; padding: 0; }

body { font-family: 'Segoe UI', Roboto, sans-serif; background: radial-gradient(circle at 50% 0%, #2a1a4a 0%, #0d0820 70%, #05030f 100%); color: #e9e4ff; padding: 20px 10px; min-height: 100vh; overflow-x: hidden; }

.app { max-width: 600px; margin: 0 auto; }

h1 { font-size: 24px; text-align: center; color: #f4e2a1; margin-bottom: 5px; text-shadow: 0 0 15px rgba(201,162,39,0.4); }

.tagline { text-align: center; color: #9a8fc0; font-size: 13px; margin-bottom: 15px; }

.current-date { text-align: center; font-size: 12px; color: #c9a227; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; background: rgba(201,162,39,0.1); display: inline-block; padding: 4px 12px; border-radius: 15px; left: 50%; position: relative; transform: translateX(-50%); }

.tabs { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }

.tab { padding: 8px 12px; border-radius: 15px; border: 1px solid #4a3a7a; background: rgba(255,255,255,0.03); color: #c9bfe8; cursor: pointer; transition: 0.3s; font-size: 12px; }

.panel { display: none; background: rgba(26, 18, 51, 0.85); padding: 20px 15px; border-radius: 15px; border: 1px solid rgba(201, 162, 39, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.4); }

.panel.active { display: block; animation: fadeIn 0.3s ease-out; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

.sign-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 15px; }

.sign-btn { padding: 10px 2px; border-radius: 8px; border: 1px solid #3d2f6b; background: rgba(0,0,0,0.2); color: #d9d0f5; cursor: pointer; text-align: center; font-size: 11px; transition: 0.2s; position: relative; overflow: hidden; }

.sign-btn.active { border-color: #c9a227; background: rgba(201,162,39,0.15); color: #fff; }

.element-line { position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; }

.el-fire { background: #ff5722; } .el-water { background: #2196f3; } .el-earth { background: #4caf50; } .el-air { background: #ffeb3b; }

.week-title { font-size: 18px; color: #f4e2a1; margin-bottom: 10px; border-bottom: 1px solid rgba(201,162,39,0.2); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;}

.week-title span { font-size: 11px; color: #9a8fc0; font-weight: normal; }

.days-nav { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }

.days-nav::-webkit-scrollbar { display: none; }

.day-btn { flex: 1; min-width: 45px; padding: 8px 3px; border-radius: 8px; border: 1px solid #3d2f6b; background: rgba(0,0,0,0.2); color: #9a8fc0; font-size: 10px; cursor: pointer; text-align: center; }

.day-btn.today { border-color: #c9a227; color: #c9a227; font-weight: bold; }

.day-btn.active { background: #6a4fc0; color: #fff; border-color: #c9a227; }

.day-btn .date-num { display: block; font-size: 15px; margin-top: 2px; font-weight: bold; }

.day-content { padding: 15px; border-left: 3px solid #c9a227; background: rgba(255,255,255,0.03); border-radius: 0 8px 8px 0; font-size: 13px; line-height: 1.5; margin-bottom: 12px; position: relative; min-height: 60px; }

.today-badge { display: inline-block; background: rgba(201,162,39,0.2); color: #c9a227; padding: 2px 6px; border-radius: 5px; font-size: 10px; margin-bottom: 5px; text-transform: uppercase; font-weight: bold; }

.meta-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }

.meta-tag { background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 6px; font-size: 11px; border: 1px solid rgba(255,255,255,0.1); }

.zodiac-watermark { position: absolute; bottom: -10px; right: 5px; font-size: 60px; opacity: 0.05; pointer-events: none; line-height: 1; }

select { width: 100%; padding: 10px; margin-bottom: 8px; background: #0d0820; color: #fff; border: 1px solid #4a3a7a; border-radius: 8px; font-size: 14px; }

.btn { padding: 12px; width: 100%; background: linear-gradient(135deg, #6a4fc0, #8a6fe0); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; margin-top: 8px; transition: 0.3s; }

.btn:hover { filter: brightness(1.2); }

.bar-track { height: 6px; background: rgba(0,0,0,0.5); border-radius: 3px; margin: 3px 0 10px; overflow: hidden; }

.bar-fill { height: 100%; background: linear-gradient(90deg, #6a4fc0, #c9a227); width: 0; transition: width 1s; }

.hidden { display: none; }

.info-block { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 2px solid #8a6fe0; }

.info-block h4 { color: #c9a227; font-size: 12px; margin-bottom: 4px; text-transform: uppercase; }

.info-block p { font-size: 13px; line-height: 1.4; }

.tarot-card { width: 120px; height: 180px; margin: 0 auto 15px; border: 2px solid #c9a227; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 40px; background: #1c1338; box-shadow: 0 0 20px rgba(201,162,39,0.2); }

.tarot-card span { font-size: 14px; color: #fff; margin-top: 10px; }

.moon-icon { font-size: 60px; text-align: center; margin: 15px 0; filter: drop-shadow(0 0 15px rgba(255,255,255,0.4)); }

.share-btn { background: transparent; border: 1px solid #4a3a7a; color: #c9bfe8; padding: 6px 12px; border-radius: 15px; cursor: pointer; font-size: 12px; margin-top: 8px; }

/* Колесо */

.wheel-container { position: relative; width: 220px; height: 220px; margin: 20px auto 30px; }

.wheel-pointer { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); font-size: 24px; z-index: 10; color: #c9a227; }

.wheel { width: 100%; height: 100%; border-radius: 50%; border: 3px solid #c9a227; position: relative; overflow: hidden; transition: transform 5s cubic-bezier(0.1, 0.9, 0.1, 1); box-shadow: 0 0 20px rgba(201,162,39,0.3); }

.wheel-center { position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; background: #0d0820; border: 2px solid #c9a227; border-radius: 50%; transform: translate(-50%, -50%); z-index: 5; display: flex; align-items: center; justify-content: center; font-size: 14px; }

.segment { position: absolute; width: 50%; height: 50%; transform-origin: 100% 100%; border: 1px solid rgba(201,162,39,0.2); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #fff; }

.fortune-result { text-align: center; padding: 15px; background: rgba(201,162,39,0.1); border-radius: 10px; border: 1px dashed #c9a227; margin-top: 15px; }

</style>

"Дева": { "Телец":"harmony", "Козерог":"harmony", "Скорпион":"harmony", "Близнецы":"hard", "Стрелец":"hard" },

"Весы": { "Близнецы":"harmony", "Водолей":"harmony", "Лев":"harmony", "Рак":"hard", "Козерог":"hard" },

"Скорпион": { "Рак":"harmony", "Рыбы":"harmony", "Дева":"harmony", "Лев":"hard", "Водолей":"hard" },

"Стрелец": { "Овен":"harmony", "Лев":"harmony", "Водолей":"harmony", "Дева":"hard", "Рыбы":"hard" },

"Козерог": { "Телец":"harmony", "Дева":"harmony", "Рыбы":"harmony", "Овен":"hard", "Весы":"hard" },

"Водолей": { "Близнецы":"harmony", "Весы":"harmony", "Стрелец":"harmony", "Телец":"hard", "Скорпион":"hard" },

"Рыбы": { "Рак":"harmony", "Скорпион":"harmony", "Козерог":"harmony", "Близнецы":"hard", "Стрелец":"hard" }

};

const TAROT = [

{ icon:"", name:"Солнце", meaning:"Успех.", advice:"Делись теплом.", avoid:"Не хвастайся." },

{ icon:"", name:"Луна", meaning:"Иллюзии.", advice:"Доверяй интуиции.", avoid:"Не решай в тумане." },

{ icon:"⭐", name:"Звезда", meaning:"Надежда.", advice:"Сделай шаг.", avoid:"Не падай духом." },

{ icon:"⚔️", name:"Справедливость", meaning:"Истина.", advice:"Будь честен.", avoid:"Не хитри." },

{ icon:"", name:"Колесо Фортуны", meaning:"Перемены.", advice:"Лови знаки.", avoid:"Не цепляйся за прошлое." }

];

const MOON_PHASES = [

{ icon:"", name:"Новолуние", desc:"Планирование. Поберегите силы." },

{ icon:"", name:"Растущая", desc:"Хорошее время для начинаний." },

{ icon:"", name:"Первая четверть", desc:"Преодоление препятствий." },

{ icon:"", name:"Прибывающая", desc:"Энергия на пике." },

{ icon:"", name:"Полнолуние", desc:"Пик эмоций. Подводите итоги." },

{ icon:"", name:"Убывающая", desc:"Замедлитесь, наведите порядок." },

{ icon:"", name:"Последняя четверть", desc:"Завершение дел." },

{ icon:"", name:"Убывающая", desc:"Подготовка к новому. Отдых." }

];

const ALL_NAMES = SIGNS.map(s => s.name);

const DAYS_SHORT = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];

const MONTHS_SHORT = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];

const today = new Date();

const todayIdx = (today.getDay() + 6) % 7;

const monday = new Date(today);

monday.setDate(today.getDate() - todayIdx);

let currentSignId = "aries";

let currentDayIdx = todayIdx;

let isSpinning = false;

let currentRotation = 0;

document.getElementById("mainDate").innerText = today.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });

// Инициализация колеса

const wheelInner = document.getElementById("wheelInner");

SIGNS.forEach((s, i) => {

const seg = document.createElement("div");

seg.className = `segment seg-${i}`;

seg.style.transform = `rotate(${i * 30}deg)`;

seg.innerHTML = `<span>${s.sym}</span>`;

wheelInner.appendChild(seg);

});

function showTab(id, btn) {

document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));

document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));

document.getElementById(id).classList.add("active");

btn.classList.add("active");

if (id === "tarot") renderTarot();

if (id === "moon") renderMoon();

}

function signButtons(containerId, onClick) {

document.getElementById(containerId).innerHTML = SIGNS.map(s =>

`<button class="sign-btn" onclick="(${onClick.name})('${s.id}')">${s.sym}<br>${s.name}<div class="element-line el-${s.el}"></div></button>`

).join("");

}

function setDay(idx) { currentDayIdx = idx; renderWeek(currentSignId); }

function renderWeek(id) {

currentSignId = id;

const s = SIGNS.find(x => x.id === id);

document.querySelectorAll("#weekSigns .sign-btn").forEach((b,i) => b.classList.toggle("active", SIGNS[i].id === id));

let daysNavHtml = '<div class="days-nav">';

for(let i=0; i<7; i++) {

let d = new Date(monday);

d.setDate(monday.getDate() + i);

daysNavHtml += `<button class="day-btn ${i === todayIdx?'today':''} ${i === currentDayIdx?'active':''}" onclick="setDay(${i})">

${DAYS_SHORT[i]}<span class="date-num">${d.getDate()}</span><span class="month-name">${MONTHS_SHORT[d.getMonth()]}</span>

</button>`;

}

daysNavHtml += '</div>';

const tags = s.tags.map(t => `<div class="meta-tag">${t}</div>`).join("");

const isTodayText = currentDayIdx === todayIdx ? `<div class="today-badge">✨ Сегодня</div>` : '';

document.getElementById("weekContent").innerHTML = `

<div class="week-title"><div>${s.sym} ${s.name}</div><span>${s.dates}</span></div>

<p style="margin-bottom:10px;font-size:12px; color:#c9bfe8">${s.week.general}</p>

${daysNavHtml}

<div class="day-content">

<div class="zodiac-watermark">${s.sym}</div>

${isTodayText}

<div style="position:relative; z-index:1;">${s.week.days[currentDayIdx]}</div>

</div>

<button class="share-btn" onclick="shareGoroscope()"> Поделиться</button>

<div class="meta-tags">${tags}</div>

`;

}

function shareGoroscope() {

const s = SIGNS.find(x => x.id === currentSignId);

const text = `Мой гороскоп на ${DAYS_SHORT[currentDayIdx]}: ${s.week.days[currentDayIdx]}`;

navigator.clipboard.writeText(text).then(() => alert("Текст скопирован!")).catch(() => alert("Ошибка."));

}

function renderDark(id) {

const s = SIGNS.find(x => x.id === id);

document.querySelectorAll("#darkSigns .sign-btn").forEach((b,i) => b.classList.toggle("active", SIGNS[i].id === id));

document.getElementById("darkContent").innerHTML = `

<div class="week-title"><div style="color:#e07fb0">${s.sym} ${s.name}</div></div>

<div class="info-block" style="border-color:#e07fb0; position:relative; overflow:hidden;">

<div class="zodiac-watermark" style="color:#e07fb0; opacity:0.1;">${s.sym}</div>

<p style="position:relative; z-index:1;">${s.dark}</p>

</div>`;

}

function renderFate(id) {

const s = SIGNS.find(x => x.id === id);

document.querySelectorAll("#fateSigns .sign-btn").forEach((b,i) => b.classList.toggle("active", SIGNS[i].id === id));

const f = FATE[s.name];

document.getElementById("fateContent").innerHTML = `

<div class="week-title"><div>${s.sym} ${s.name}</div></div>

<div style="position:relative; overflow:hidden;">

<div class="zodiac-watermark">${s.sym}</div>

<div class="info-block"><h4> Тема</h4><p><b>${f.theme}:</b> ${f.themeDesc}</p></div>

<div class="info-block"><h4> Сила</h4><p><b>${f.strong}:</b> ${f.strongDesc}</p></div>

<div class="info-block"><h4> Урок</h4><p><b>${f.lesson}:</b> ${f.lessonDesc}</p></div>

</div>

`;

}

signButtons("weekSigns", renderWeek); renderWeek(currentSignId);

signButtons("darkSigns", renderDark); renderDark("aries");

signButtons("fateSigns", renderFate); renderFate("aries");

document.getElementById("signA").innerHTML = ALL_NAMES.map(n => `<option>${n}</option>`).join("");

document.getElementById("signB").innerHTML = ALL_NAMES.map(n => `<option>${n}</option>`).join("");

document.getElementById("signB").selectedIndex = 1;

function calcCompat() {

const a = document.getElementById("signA").value;

const b = document.getElementById("signB").value;

let type = "neutral";

if (COMPAT[a] && COMPAT[a][b]) type = COMPAT[a][b];

else if (COMPAT[b] && COMPAT[b][a]) type = COMPAT[b][a];

let base = [65, 60, 65, 70];

let text = "Спокойный союз.";

if (type === "harmony") { base = [88, 92, 80, 85]; text = "Сильное притяжение."; }

else if (type === "hard") { base = [45, 65, 40, 45]; text = "Непростой союз."; }

const set = (id, v) => document.getElementById(id).style.width = v + "%";

set("bLove", base[0]); set("bPassion", base[1]); set("bMind", base[2]); set("bFriend", base[3]);

document.getElementById("compatText").innerText = text;

document.getElementById("compatResult").classList.remove("hidden");

}

function renderTarot() {

const t = TAROT[Math.floor(Math.random() * TAROT.length)];

document.getElementById("tIcon").innerText = t.icon;

document.getElementById("tName").innerText = t.name;

document.getElementById("tarotDetails").innerHTML = `

<div class="info-block"><h4> Значение</h4><p>${t.meaning}</p></div>

<div class="info-block" style="border-color:#4caf50;"><h4>✨ Пожелание</h4><p>${t.advice}</p></div>

<div class="info-block" style="border-color:#f44336;"><h4>⚠️ Избегать</h4><p>${t.avoid}</p></div>

`;

}

function renderMoon() {

const daysSince = (new Date() - new Date('2024-01-11')) / (1000 * 60 * 60 * 24);

const phaseIndex = Math.floor(((daysSince % 29.53) / 29.53) * 8) % 8;

const phase = MOON_PHASES[phaseIndex];

document.getElementById("moonIcon").innerText = phase.icon;

document.getElementById("moonPhaseName").innerText = phase.name;

document.getElementById("moonDesc").innerText = phase.desc;

}

function spinWheel() {

if (isSpinning) return;

isSpinning = true;

document.getElementById("fortuneResult").classList.add("hidden");

const randomIndex = Math.floor(Math.random() * 12);

const targetAngle = 360 - (randomIndex * 30);

const totalRotation = currentRotation + 1800 + (targetAngle - (currentRotation % 360));

currentRotation = totalRotation;

document.getElementById("wheel").style.transform = `rotate(${currentRotation}deg)`;

setTimeout(() => {

isSpinning = false;

const randomSign = SIGNS[randomIndex];

const randomDay = Math.floor(Math.random() * 7);

document.getElementById("fSign").innerText = `Послание от ${randomSign.name} ${randomSign.sym}`;

document.getElementById("fText").innerText = `"${randomSign.week.days[randomDay]}"`;

document.getElementById("fortuneResult").classList.remove("hidden");

}, 5100);

}

</script>
